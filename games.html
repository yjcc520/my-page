<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小游戏 | 蔡梓涵</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .games-page { padding: 6rem 2rem 4rem; max-width: 900px; margin: 0 auto; min-height: 70vh; }
        .games-header { text-align: center; margin-bottom: 2.5rem; }
        .games-header h1 { font-size: 2.2rem; margin-bottom: 0.3rem; }
        .games-header p { color: var(--text-light); font-size: 1rem; }
        .games-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1.5rem; }
        .game-card { background: #fff; border: 1px solid var(--border); border-radius: 14px; overflow: hidden; transition: box-shadow 0.2s, transform 0.2s; }
        .game-card:hover { box-shadow: 0 8px 30px rgba(0,0,0,0.1); transform: translateY(-3px); }
        .game-cover { height: 160px; background: linear-gradient(135deg, #0f0c29, #302b63, #24243e); display: flex; align-items: center; justify-content: center; font-size: 3.5rem; }
        .game-info { padding: 1.2rem; }
        .game-info h3 { font-size: 1.1rem; margin-bottom: 0.3rem; }
        .game-info p { font-size: 0.85rem; color: var(--text-light); margin-bottom: 0.8rem; line-height: 1.5; }
        .game-play-btn { display: inline-block; padding: 0.4rem 1.2rem; background: var(--primary); color: #fff; text-decoration: none; border-radius: 6px; font-size: 0.85rem; font-weight: 500; transition: background 0.2s; }
        .game-play-btn:hover { background: var(--primary-light); }
    </style>
</head>
<body>
    <nav>
        <div class="nav-inner">
            <a href="index.html" class="logo">Zihan</a>
            <div class="nav-links">
                <a href="index.html">首页</a>
                <a href="blog.html">博客</a>
                <a href="games.html" class="active">小游戏</a>
            </div>
        </div>
    </nav>

    <div class="games-page">
        <div class="games-header">
            <h1>小游戏</h1>
            <p>闲暇之余，来一局</p>
        </div>
        <div class="games-grid">
            <div class="game-card">
                <div class="game-cover">🎯</div>
                <div class="game-info">
                    <h3>射爆邓宸铭</h3>
                    <p>驾驶战机，消灭敌人。多种道具和皮肤等你解锁。</p>
                    <a href="games/shoot.html" class="game-play-btn">开始游戏</a>
                </div>
            </div>
        </div>
    </div>

    <footer><p>&copy; 2026 蔡梓涵 · Powered by GitHub Pages</p></footer>
    <script src="user.js"></script>
</body>
</html>
