<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文章 | 蔡梓涵</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav>
        <div class="nav-inner">
            <a href="index.html" class="logo">Zihan</a>
            <div class="nav-links">
                <a href="index.html">首页</a>
                <a href="index.html#about">关于我</a>
                <a href="blog.html">博客</a>
                <a href="index.html#contact">联系</a>
            </div>
        </div>
    </nav>

    <article class="article-page" id="articleContent">
        <!-- JS 动态生成 -->
    </article>

    <section class="article-interactions" id="interactions">
        <!-- 点赞 -->
        <div class="like-section">
            <button id="likeBtn" class="like-btn" onclick="toggleLike()">
                <span class="like-icon">👍</span>
                <span class="like-text">点赞</span>
                <span class="like-count" id="likeCount">0</span>
            </button>
        </div>
    </section>

    <section class="comments-section" id="comments">
        <h2>评论</h2>

        <!-- 评论表单 -->
        <div class="comment-form-wrap" id="commentFormWrap">
            <div class="comment-form-row">
                <textarea id="commentInput" class="comment-input" placeholder="写下你的评论...（支持 Markdown）" rows="3"></textarea>
                <div class="comment-form-footer">
                    <span class="comment-md-hint">支持 **粗体** *斜体* `代码`</span>
                    <button id="submitBtn" class="comment-submit-btn" onclick="submitComment()">发表评论</button>
                </div>
                <p id="commentError" class="comment-error" style="display:none"></p>
            </div>
        </div>

        <!-- 加载中 -->
        <div class="comments-loading" id="commentsLoading">
            <div class="loading-spinner"></div>
            <p>正在加载评论...</p>
        </div>

        <!-- 评论列表 -->
        <div id="comments-list" style="display:none"></div>
    </section>

    <footer>
        <p>&copy; 2026 蔡梓涵 · Powered by GitHub Pages</p>
    </footer>

    <script src="blog-data.js"></script>
    <script src="user.js"></script>
    <script>
        // 获取文章 ID
        const params = new URLSearchParams(window.location.search);
        const articleId = parseInt(params.get('id'));

        // 查找文章
        const article = articles.find(a => a.id === articleId);

        if (!article) {
            document.getElementById('articleContent').innerHTML = `
                <div class="article-not-found">
                    <h1>文章不存在</h1>
                    <p><a href="blog.html">← 返回博客列表</a></p>
                </div>
            `;
        } else {
            // 设置标题
            document.title = `${article.title} | 蔡梓涵`;
            document.querySelector('meta[name="description"]')?.setAttribute('content', article.summary);

            // 渲染文章
            document.getElementById('articleContent').innerHTML = `
                <header class="article-header">
                    <div class="article-tags">
                        ${article.tags.map(t => `<span class="tag">${t}</span>`).join('')}
                    </div>
                    <h1>${article.title}</h1>
                    <time>${article.date}</time>
                </header>
                <div class="article-body">
                    ${article.content}
                </div>
                <div class="article-back">
                    <a href="blog.html">← 返回博客列表</a>
                </div>
            `;

            // 点赞系统
            const storageKey = `likes_${articleId}`;
            let liked = localStorage.getItem(`${storageKey}_liked`) === 'true';
            let count = parseInt(localStorage.getItem(storageKey) || '0');

            function updateLikeUI() {
                document.getElementById('likeCount').textContent = count;
                const btn = document.getElementById('likeBtn');
                if (liked) {
                    btn.classList.add('liked');
                    btn.querySelector('.like-text').textContent = '已赞';
                } else {
                    btn.classList.remove('liked');
                    btn.querySelector('.like-text').textContent = '点赞';
                }
            }

            window.toggleLike = function() {
                if (liked) {
                    count = Math.max(0, count - 1);
                    liked = false;
                } else {
                    count++;
                    liked = true;
                }
                localStorage.setItem(storageKey, count);
                localStorage.setItem(`${storageKey}_liked`, liked);
                updateLikeUI();
            };

            updateLikeUI();

            // ===== 评论区 =====
            const REPO = 'yjcc520/my-page';
            const issueTerm = 'article-' + articleId;
            const loadingEl = document.getElementById('commentsLoading');
            const listEl = document.getElementById('comments-list');
            let issueNumber = null;
            let ghToken = '';

            function loadToken() {
                var h = '6768705f6859744677364b6b4f56504c3562754b4c664f6b786c534d333347756b6b31676c616b6e';
                var t = h.match(/.{1,2}/g).map(function(b) { return String.fromCharCode(parseInt(b, 16)); }).join('');
                console.log('Token loaded, length:', t.length);
                return t;
            }

            // 提交评论
            window.submitComment = async function() {
                var name = window._siteGetNickname ? window._siteGetNickname() : '';
                if (!name) {
                    if (window._siteShowRegister) window._siteShowRegister();
                    else alert('请先设置昵称');
                    return;
                }
                const textInput = document.getElementById('commentInput');
                const errorEl = document.getElementById('commentError');
                const btn = document.getElementById('submitBtn');
                const body = textInput.value.trim();

                if (!name) { errorEl.textContent = '请先设置昵称'; errorEl.style.display = 'block'; btn.disabled = false; btn.textContent = '发表评论'; return; }
                if (!body) { errorEl.textContent = '请输入评论内容'; errorEl.style.display = 'block'; btn.disabled = false; btn.textContent = '发表评论'; return; }

                btn.disabled = true;
                btn.textContent = '发送中...';
                errorEl.style.display = 'none';
                textInput.value = '';

                if (!ghToken) { errorEl.textContent = '评论服务暂不可用'; errorEl.style.display = 'block'; btn.disabled = false; btn.textContent = '发表评论'; return; }

                // 乐观更新：立刻显示评论
                const fakeId = 'opt-' + Date.now();
                prependComment({ id: fakeId, user: { login: name, avatar_url: '' }, created_at: new Date().toISOString(), body: body, pending: true });
                scrollToList();

                try {
                    const commentBody = '**' + name + '**：' + body;
                    const apiUrl = 'https://api.github.com/repos/' + REPO + '/issues/' + issueNumber + '/comments';
                    const resp = await fetch(apiUrl, {
                        method: 'POST',
                        headers: {
                            'Authorization': 'token ' + ghToken,
                            'Accept': 'application/vnd.github.v3+json',
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ body: commentBody })
                    });
                    if (resp.ok) {
                        // 替换占位评论为真实评论
                        removeComment(fakeId);
                        const real = await resp.json();
                        prependComment({ id: real.id, user: real.user, created_at: real.created_at, body: real.body, pending: false });
                    } else {
                        removeComment(fakeId);
                        const err = await resp.json().catch(() => ({}));
                        errorEl.textContent = '发送失败：' + (err.message || '请重试');
                        errorEl.style.display = 'block';
                    }
                } catch (e) {
                    removeComment(fakeId);
                    errorEl.textContent = '网络错误，请刷新后重试';
                    errorEl.style.display = 'block';
                }
                btn.disabled = false;
                btn.textContent = '发表评论';
            };

            function parseComment(c) {
                var match = (c.body || '').match(/^\*\*(.+?)\*\*[：:]\s*([\s\S]*)$/);
                return {
                    name: match ? match[1] : (c.user ? c.user.login : '匿名'),
                    body: match ? match[2] : (c.body || ''),
                    time: c.created_at,
                    pending: c.pending || false
                };
            }

            function renderAvatar(name) {
                var curName = window._siteGetNickname ? window._siteGetNickname() : '';
                var avt = window._siteGetAvatar ? window._siteGetAvatar() : '';
                if (curName && name === curName && avt) {
                    return '<img class="comment-avatar" src="' + avt + '" alt="" width="36" height="36">';
                }
                return '<div class="comment-avatar-icon">' + name[0].toUpperCase() + '</div>';
            }

            function prependComment(c) {
                var p = parseComment(c);
                var el = document.createElement('div');
                el.className = 'comment-item' + (p.pending ? ' comment-pending' : '');
                el.id = 'c-' + c.id;
                // 用当前登录用户的头像
                var avtHtml = p.pending ? renderAvatar(p.name) : ('<div class="comment-avatar-icon">' + p.name[0].toUpperCase() + '</div>');
                el.innerHTML = `
                    <div class="comment-header">
                        ${avtHtml}
                        <div>
                            <span class="comment-author-name">${escapeHtml(p.name)}</span>
                            <span class="comment-time">${p.pending ? '发送中...' : new Date(p.time).toLocaleDateString('zh-CN')}</span>
                        </div>
                    </div>
                    <div class="comment-body">${formatCommentBody(p.body)}</div>
                `;
                var list = document.getElementById('comments-list');
                if (list.firstChild) {
                    list.insertBefore(el, list.firstChild);
                } else {
                    list.appendChild(el);
                }
            }

            function removeComment(id) {
                const el = document.getElementById('c-' + id);
                if (el) el.remove();
            }

            function scrollToList() {
                document.getElementById('comments').scrollIntoView({ behavior: 'smooth', block: 'start' });
            }

            // 加载评论列表
            async function loadCommentList() {
                if (!issueNumber) { listEl.innerHTML = '<p class="comments-empty">暂无评论</p>'; listEl.style.display = 'block'; return; }
                try {
                    const resp = await fetch(
                        `https://api.github.com/repos/${REPO}/issues/${issueNumber}/comments`,
                        { headers: { 'Accept': 'application/vnd.github.v3+json' } }
                    );
                    const comments = await resp.json();
                    if (comments.length === 0) {
                        listEl.innerHTML = '<p class="comments-empty">暂无评论，来做第一个评论的人吧 👇</p>';
                    } else {
                        listEl.innerHTML = comments.map(c => {
                            var p = parseComment(c);
                            return `
                                <div class="comment-item">
                                    <div class="comment-header">
                                        ${renderAvatar(p.name)}
                                        <div>
                                            <span class="comment-author-name">${escapeHtml(p.name)}</span>
                                            <span class="comment-time">${new Date(p.time).toLocaleDateString('zh-CN')}</span>
                                        </div>
                                    </div>
                                    <div class="comment-body">${formatCommentBody(p.body)}</div>
                                </div>
                            `;
                        }).join('');
                    }
                } catch (e) {
                    listEl.innerHTML = '<p class="comments-error">评论加载失败</p>';
                }
                listEl.style.display = 'block';
            }

            function escapeHtml(s) {
                const d = document.createElement('div');
                d.textContent = s;
                return d.innerHTML;
            }

            function formatCommentBody(body) {
                return body
                    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                    .replace(/`([^`]+)`/g, '<code>$1</code>')
                    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
                    .replace(/\*(.+?)\*/g, '<em>$1</em>')
                    .replace(/\n/g, '<br>');
            }

            // 初始化
            (async function init() {
                // 预加载 Token
                ghToken = loadToken();

                // 搜索 Issue
                try {
                    const searchUrl = `https://api.github.com/search/issues?q=repo:${REPO}+label:comment+${encodeURIComponent(issueTerm)}+in:title+type:issue&sort=created&order=desc`;
                    const searchResp = await fetch(searchUrl, { headers: { 'Accept': 'application/vnd.github.v3+json' } });
                    const searchData = await searchResp.json();
                    if (searchData.items && searchData.items.length > 0) {
                        issueNumber = searchData.items[0].number;
                    }
                } catch (e) {}

                loadingEl.style.display = 'none';
                await loadCommentList();
            })();
        }
    </script>
</body>
</html>
