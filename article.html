<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文章 | 蔡梓涵</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="apple-touch-icon" href="/favicon.svg">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav>
        <div class="nav-inner">
            <a href="index.html" class="logo">Zihan</a>
            <div class="nav-links">
                <a href="index.html">首页</a>
                <a href="index.html#about">关于我</a>
                <a href="blog.html">博客</a>
                <a href="index.html#contact">联系</a>
                <button class="theme-toggle" onclick="_toggleTheme()" title="切换主题">☀️</button>
            </div>
        </div>
    </nav>

    <article class="article-page" id="articleContent"></article>

    <section class="article-interactions" id="interactions">
        <div class="like-section">
            <button id="likeBtn" class="like-btn" onclick="toggleLike()">
                <span class="like-icon">👍</span>
                <span class="like-text">点赞</span>
                <span class="like-count" id="likeCount">0</span>
            </button>
        </div>
    </section>

    <section class="comments-section" id="comments">
        <h2>评论</h2>
        <p style="text-align:center;color:var(--text-light);font-size:0.85rem;margin-bottom:1.2rem;">
            用 GitHub 账号登录即可评论<span id="articlePv"></span>
        </p>
        <div id="giscusHost"></div>
    </section>

    <footer><p>&copy; 2026 蔡梓涵 · Powered by GitHub Pages</p></footer>

    <!-- 访问量占位（第三方计数脚本写入此处，再由页面取值渲染） -->
    <div style="display:none" aria-hidden="true">
        <span id="busuanzi_container_page_pv">本页访问量<span id="busuanzi_value_page_pv"></span>次</span>
    </div>

    <script src="blog-data.js"></script>
    <script src="user.js"></script>
    <script src="stats.js"></script>
    <script src="gh-publish.js"></script>
    <script>
var REPO = 'yjcc520/my-page';

function eHtml(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function fm(md) { return ('<p>' + (md || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/### (.+)/g, '<h4>$1</h4>').replace(/## (.+)/g, '<h3>$1</h3>').replace(/# (.+)/g, '<h2>$1</h2>').replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/\*(.+?)\*/g, '<em>$1</em>').replace(/`([^`]+)`/g, '<code>$1</code>').replace(/^> (.+)/gm, '<blockquote>$1</blockquote>').replace(/\n\n/g, '</p><p>').replace(/\n/g, '<br>') + '</p>'); }

// ===== 删除文章 =====
// 关闭 Issue 需要仓库权限，因此改为跳到 GitHub 上操作；预置文章则记在本地
window.deleteArticle = function (id) {
    window._showConfirm('删除需要到 GitHub 上关闭这篇 Issue，现在打开吗？', function () {
        window.open(window._ghIssueUrl(id), '_blank', 'noopener');
    });
};

window.deletePreset = function (id) {
    window._showConfirm('确定隐藏这篇预置文章吗？（仅对当前浏览器生效）', function () {
        var list = [];
        try { list = JSON.parse(localStorage.getItem('deleted_presets') || '[]'); } catch (e) {}
        if (list.indexOf(id) < 0) list.push(id);
        localStorage.setItem('deleted_presets', JSON.stringify(list));
        window.location.href = 'blog.html';
    });
};

// ===== 文章加载 =====
var params = new URLSearchParams(window.location.search);
var aid = parseInt(params.get('id'));
var isIssue = params.get('type') === 'issue';

// giscus 按文章区分讨论话题：article-<id>
// 只有文章确实存在时才挂载，避免有人构造任意 id 凭空创建讨论
window._mountArticleComments = function () {
    var el = document.getElementById('giscusHost');
    el.className = 'giscus-host';
    el.setAttribute('data-giscus-term', 'article-' + aid);
    if (window._mountComments) window._mountComments('#giscusHost');
};

_trackRead(aid);
window._onStatsReady = function (sitePv, pagePv) {
    if (pagePv) document.getElementById('articlePv').textContent = ' · 本页阅读 ' + pagePv + ' 次';
};

if (isIssue) {
    (async function () {
        try {
            var resp = await fetch('https://api.github.com/repos/yjcc520/my-page/issues/' + aid, {
                headers: { 'Accept': 'application/vnd.github.v3+json' }
            });
            if (!resp.ok) throw new Error('nf');
            var issue = await resp.json(), body = issue.body || '';
            var content = body.replace(/\*\*作者\*\*[：:].+\n?/, '').replace(/\*\*标签\*\*[：:].+\n?/, '').trim();
            var tags = [], tm = body.match(/\*\*标签\*\*[：:]\s*(.+)/);
            if (tm) tags = tm[1].split(/[,，]/).map(function (t) { return t.trim(); }).filter(Boolean);
            document.title = issue.title + ' | 蔡梓涵';
            var isForum = issue.labels.some(function (l) { return l.name === 'forum'; });
            var delBtn = '<button class="article-del-btn" onclick="deleteArticle(' + aid + ')" title="到 GitHub 上删除">🗑</button>';
            var backLink = isForum ? '<a href="forum.html">← 返回论坛</a>' : '<a href="blog.html">← 返回博客列表</a>';
            document.getElementById('articleContent').innerHTML =
                '<header class="article-header"><div class="article-tags">' + tags.map(function (t) { return '<span class="tag">' + t + '</span>'; }).join('') + '</div><h1>' + issue.title + '</h1><time>' + issue.created_at.split('T')[0] + '</time>' + delBtn + '</header><div class="article-body">' + fm(content) + '</div><div class="article-back">' + backLink + '</div>';
            document.getElementById('interactions').style.display = 'none';
            window._mountArticleComments();
        } catch (e) {
            document.getElementById('articleContent').innerHTML = '<div class="article-not-found"><h1>文章不存在</h1><p><a href="blog.html">← 返回博客列表</a></p></div>';
        document.getElementById('comments').style.display = 'none';
        }
    })();
} else {
    var article = articles.find(function (a) { return a.id === aid; });
    if (!article) {
        document.getElementById('articleContent').innerHTML = '<div class="article-not-found"><h1>文章不存在</h1><p><a href="blog.html">← 返回博客列表</a></p></div>';
        document.getElementById('comments').style.display = 'none';
    } else {
        document.title = article.title + ' | 蔡梓涵';
        var preDelBtn = '<button class="article-del-btn" onclick="deletePreset(' + aid + ')" title="隐藏文章">🗑</button>';
        document.getElementById('articleContent').innerHTML =
            '<header class="article-header"><div class="article-tags">' + article.tags.map(function (t) { return '<span class="tag">' + t + '</span>'; }).join('') + '</div><h1>' + article.title + '</h1><time>' + article.date + '</time>' + preDelBtn + '</header><div class="article-body">' + article.content + '</div><div class="article-back"><a href="blog.html">← 返回博客列表</a></div>';

        var sk = 'likes_' + aid;
        var liked = localStorage.getItem(sk + '_liked') === 'true';
        var count = parseInt(localStorage.getItem(sk) || '0');
        function ul() {
            document.getElementById('likeCount').textContent = count;
            var b = document.getElementById('likeBtn');
            if (liked) { b.classList.add('liked'); b.querySelector('.like-text').textContent = '已赞'; }
            else { b.classList.remove('liked'); b.querySelector('.like-text').textContent = '点赞'; }
        }
        window.toggleLike = function () {
            if (liked) { count = Math.max(0, count - 1); liked = false; } else { count++; liked = true; }
            localStorage.setItem(sk, count);
            localStorage.setItem(sk + '_liked', liked);
            ul();
        };
        ul();
        window._mountArticleComments();
    }
}
    </script>
    <script src="theme.js"></script>
    <script src="music.js"></script>
    <script src="comments.js"></script>
    <script src="ux.js"></script>
</body>
</html>
