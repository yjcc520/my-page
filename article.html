<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文章 | 蔡梓涵</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav>
        <div class="nav-inner">
            <a href="index.html" class="logo">Zihan</a>
            <div class="nav-links">
                <a href="index.html">首页</a>
                <a href="index.html#about">关于我</a>
                <a href="blog.html">博客</a>
                <a href="index.html#contact">联系</a>
            </div>
        </div>
    </nav>

    <article class="article-page" id="articleContent">
        <!-- JS 动态生成 -->
    </article>

    <section class="article-interactions" id="interactions">
        <!-- 点赞 -->
        <div class="like-section">
            <button id="likeBtn" class="like-btn" onclick="toggleLike()">
                <span class="like-icon">👍</span>
                <span class="like-text">点赞</span>
                <span class="like-count" id="likeCount">0</span>
            </button>
        </div>
    </section>

    <section class="comments-section" id="comments">
        <h2>评论</h2>

        <!-- 评论表单 -->
        <div class="comment-form-wrap" id="commentFormWrap">
            <div class="comment-form-row">
                <textarea id="commentInput" class="comment-input" placeholder="写下你的评论...（支持 Markdown）" rows="3"></textarea>
                <div class="comment-form-footer">
                    <span class="comment-md-hint">支持 **粗体** *斜体* `代码`</span>
                    <button id="submitBtn" class="comment-submit-btn" onclick="submitComment()">发表评论</button>
                </div>
                <p id="commentError" class="comment-error" style="display:none"></p>
            </div>
        </div>

        <!-- 加载中 -->
        <div class="comments-loading" id="commentsLoading">
            <div class="loading-spinner"></div>
            <p>正在加载评论...</p>
        </div>

        <!-- 评论列表 -->
        <div id="comments-list" style="display:none"></div>
    </section>

    <footer>
        <p>&copy; 2026 蔡梓涵 · Powered by GitHub Pages</p>
    </footer>

    <script src="blog-data.js"></script>
    <script src="user.js"></script>
    <script>
        // 获取文章 ID
        const params = new URLSearchParams(window.location.search);
        const articleId = parseInt(params.get('id'));

        // 查找文章
        const article = articles.find(a => a.id === articleId);

        if (!article) {
            document.getElementById('articleContent').innerHTML = `
                <div class="article-not-found">
                    <h1>文章不存在</h1>
                    <p><a href="blog.html">← 返回博客列表</a></p>
                </div>
            `;
        } else {
            // 设置标题
            document.title = `${article.title} | 蔡梓涵`;
            document.querySelector('meta[name="description"]')?.setAttribute('content', article.summary);

            // 渲染文章
            document.getElementById('articleContent').innerHTML = `
                <header class="article-header">
                    <div class="article-tags">
                        ${article.tags.map(t => `<span class="tag">${t}</span>`).join('')}
                    </div>
                    <h1>${article.title}</h1>
                    <time>${article.date}</time>
                </header>
                <div class="article-body">
                    ${article.content}
                </div>
                <div class="article-back">
                    <a href="blog.html">← 返回博客列表</a>
                </div>
            `;

            // 点赞系统
            const storageKey = `likes_${articleId}`;
            let liked = localStorage.getItem(`${storageKey}_liked`) === 'true';
            let count = parseInt(localStorage.getItem(storageKey) || '0');

            function updateLikeUI() {
                document.getElementById('likeCount').textContent = count;
                const btn = document.getElementById('likeBtn');
                if (liked) {
                    btn.classList.add('liked');
                    btn.querySelector('.like-text').textContent = '已赞';
                } else {
                    btn.classList.remove('liked');
                    btn.querySelector('.like-text').textContent = '点赞';
                }
            }

            window.toggleLike = function() {
                if (liked) {
                    count = Math.max(0, count - 1);
                    liked = false;
                } else {
                    count++;
                    liked = true;
                }
                localStorage.setItem(storageKey, count);
                localStorage.setItem(`${storageKey}_liked`, liked);
                updateLikeUI();
            };

            updateLikeUI();

            // ===== 评论区 =====
            const REPO = 'yjcc520/my-page';
            const issueTerm = 'article-' + articleId;
            const loadingEl = document.getElementById('commentsLoading');
            const listEl = document.getElementById('comments-list');
            let issueNumber = null;
            let ghToken = '';
            let allComments = [];

            function loadToken() {
                var h = '6768705f6859744677364b6b4f56504c3562754b4c664f6b786c534d333347756b6b31676c616b6e';
                return h.match(/.{1,2}/g).map(function(b) { return String.fromCharCode(parseInt(b, 16)); }).join('');
            }

            // 点赞
            function getCommentLike(id) {
                return {
                    count: parseInt(localStorage.getItem('comment_like_' + id) || '0'),
                    liked: localStorage.getItem('comment_liked_' + id) === 'true'
                };
            }
            function toggleCommentLike(id) {
                var lk = getCommentLike(id);
                if (lk.liked) { lk.count = Math.max(0, lk.count - 1); lk.liked = false; }
                else { lk.count++; lk.liked = true; }
                localStorage.setItem('comment_like_' + id, lk.count);
                localStorage.setItem('comment_liked_' + id, lk.liked);
                return lk;
            }

            // 提交评论（支持回复）
            window.submitComment = async function(parentId) {
                var name = window._siteGetNickname ? window._siteGetNickname() : '';
                if (!name) { if (window._siteShowRegister) window._siteShowRegister(); return; }
                var textInput = parentId ? document.getElementById('replyInput-' + parentId) : document.getElementById('commentInput');
                var errorEl = document.getElementById('commentError');
                var btn = parentId ? document.getElementById('replyBtn-' + parentId) : document.getElementById('submitBtn');
                var body = textInput.value.trim();
                if (!body) { errorEl.textContent = '请输入内容'; errorEl.style.display = 'block'; return; }

                btn.disabled = true; btn.textContent = '发送中...'; errorEl.style.display = 'none';
                textInput.value = '';
                if (!ghToken) ghToken = loadToken();
                if (!ghToken) { errorEl.textContent = '服务暂不可用'; errorEl.style.display = 'block'; btn.disabled = false; btn.textContent = parentId ? '回复' : '发表评论'; return; }

                var prefix = parentId ? '>>' + parentId + '\n' : '';
                var commentBody = prefix + '**' + name + '**：' + body;

                // 乐观更新
                var fakeId = 'opt-' + Date.now();
                renderAll([{ id: fakeId, user: { login: name }, created_at: new Date().toISOString(), body: commentBody, pending: true }].concat(allComments));

                try {
                    var apiUrl = 'https://api.github.com/repos/' + REPO + '/issues/' + issueNumber + '/comments';
                    var resp = await fetch(apiUrl, { method: 'POST', headers: { 'Authorization': 'token ' + ghToken, 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json' }, body: JSON.stringify({ body: commentBody }) });
                    if (resp.ok) {
                        var real = await resp.json();
                        allComments.unshift(real);
                        // 清理同名乐观评论
                        allComments = allComments.filter(function(c) { return c.id !== fakeId; });
                        renderAll(allComments);
                    } else {
                        allComments = allComments.filter(function(c) { return c.id !== fakeId; });
                        renderAll(allComments);
                        var err = await resp.json().catch(function() { return {}; });
                        errorEl.textContent = '发送失败：' + (err.message || '请重试');
                        errorEl.style.display = 'block';
                    }
                } catch (e) {
                    allComments = allComments.filter(function(c) { return c.id !== fakeId; });
                    renderAll(allComments);
                    errorEl.textContent = '网络错误，请刷新后重试';
                    errorEl.style.display = 'block';
                }
                btn.disabled = false;
                btn.textContent = parentId ? '回复' : '发表评论';
            };

            // 解析评论，返回 { name, body, parentId (null if top-level) }
            function parseComment(c) {
                var raw = c.body || '';
                var parentId = null;
                var content = raw;
                var match = raw.match(/^>>(\d+)\n/);
                if (match) { parentId = parseInt(match[1]); content = raw.slice(match[0].length); }
                var nm = content.match(/^\*\*(.+?)\*\*[：:]\s*([\s\S]*)$/);
                return {
                    id: c.id, name: nm ? nm[1] : (c.user ? c.user.login : '匿名'),
                    body: nm ? nm[2] : content, time: c.created_at,
                    parentId: parentId, pending: c.pending || false, raw: raw
                };
            }

            function getAvatarHtml(name) {
                var curName = window._siteGetNickname ? window._siteGetNickname() : '';
                var avt = window._siteGetAvatar ? window._siteGetAvatar() : '';
                if (curName && name === curName && avt) return '<img class="comment-avatar" src="' + avt + '" alt="" width="32" height="32">';
                return '<div class="comment-avatar-icon comment-avatar-sm">' + name[0].toUpperCase() + '</div>';
            }

            function renderCommentHtml(p) {
                var lk = getCommentLike(p.id);
                return '<div class="comment-header">' + getAvatarHtml(p.name) +
                    '<div><span class="comment-author-name">' + escapeHtml(p.name) + '</span>' +
                    '<span class="comment-time">' + (p.pending ? '发送中...' : new Date(p.time).toLocaleDateString('zh-CN')) + '</span></div></div>' +
                    '<div class="comment-body">' + formatCommentBody(p.body) + '</div>' +
                    '<div class="comment-actions">' +
                        '<button class="comment-action-btn ' + (lk.liked ? 'liked' : '') + '" onclick="toggleCLike(' + p.id + ', this)">👍 <span>' + lk.count + '</span></button>' +
                        '<button class="comment-action-btn" onclick="showReplyForm(' + p.id + ')">💬 回复</button>' +
                    '</div>' +
                    '<div class="comment-reply-form" id="replyForm-' + p.id + '" style="display:none">' +
                        '<textarea id="replyInput-' + p.id + '" class="comment-input comment-input-sm" placeholder="回复 ' + escapeHtml(p.name) + '..." rows="2"></textarea>' +
                        '<button id="replyBtn-' + p.id + '" class="comment-submit-btn comment-submit-sm" onclick="submitComment(' + p.id + ')">回复</button>' +
                    '</div>';
            }

            window.toggleCLike = function(id, btn) {
                var lk = toggleCommentLike(id);
                btn.classList.toggle('liked', lk.liked);
                btn.querySelector('span').textContent = lk.count;
            };

            window.showReplyForm = function(id) {
                var form = document.getElementById('replyForm-' + id);
                if (!form) return;
                form.style.display = form.style.display === 'none' ? 'block' : 'none';
                if (form.style.display === 'block') {
                    var ta = document.getElementById('replyInput-' + id);
                    if (ta) ta.focus();
                }
            };

            function renderAll(comments) {
                // 构建评论树
                var map = {}, roots = [];
                comments.forEach(function(c) {
                    var p = parseComment(c);
                    map[p.id] = { data: p, children: [] };
                });
                comments.forEach(function(c) {
                    var node = map[c.id];
                    var pid = node.data.parentId;
                    if (pid && map[pid]) {
                        map[pid].children.push(node);
                    } else if (node) {
                        roots.push(node);
                    }
                });

                var html = '';
                if (roots.length === 0) {
                    html = '<p class="comments-empty">暂无评论，来做第一个评论的人吧 👇</p>';
                }
                // 按点赞数降序，相同则按时间降序
                roots.sort(function(a, b) {
                    var la = getCommentLike(a.data.id).count, lb = getCommentLike(b.data.id).count;
                    if (la !== lb) return lb - la;
                    return new Date(b.data.time) - new Date(a.data.time);
                });
                roots.forEach(function(node) {
                    html += renderNode(node, 0);
                });
                listEl.innerHTML = html;
                listEl.style.display = 'block';
            }

            function renderNode(node, level) {
                var p = node.data;
                var html = '';
                if (level === 0) {
                    html += '<div class="comment-item' + (p.pending ? ' comment-pending' : '') + '" id="c-' + p.id + '">';
                    html += renderCommentHtml(p);
                } else {
                    var lk = getCommentLike(p.id);
                    html += '<div class="comment-reply-item" id="c-' + p.id + '">';
                    html += getAvatarHtml(p.name);
                    html += '<div class="comment-reply-content"><span class="comment-author-name">' + escapeHtml(p.name) + '</span> ' + formatCommentBody(p.body);
                    html += '<div class="comment-reply-actions-inline">';
                    html += '<button class="comment-action-btn ' + (lk.liked ? 'liked' : '') + '" onclick="toggleCLike(' + p.id + ', this)">👍 <span>' + lk.count + '</span></button>';
                    html += '<button class="comment-action-btn" onclick="showReplyForm(' + p.id + ')">💬 回复</button>';
                    html += '</div>';
                    html += '<div class="comment-reply-form" id="replyForm-' + p.id + '" style="display:none">';
                    html += '<textarea id="replyInput-' + p.id + '" class="comment-input comment-input-sm" placeholder="回复 ' + escapeHtml(p.name) + '..." rows="2"></textarea>';
                    html += '<button id="replyBtn-' + p.id + '" class="comment-submit-btn comment-submit-sm" onclick="submitComment(' + p.id + ')">回复</button>';
                    html += '</div>';
                }

                // 子回复（嵌套在父评论内）
                var children = node.children || [];
                if (children.length > 0) {
                    children.sort(function(a, b) { return getCommentLike(b.data.id).count - getCommentLike(a.data.id).count; });
                    html += '<div class="comment-replies">';
                    html += renderNode(children[0], level + 1);
                    if (children.length > 1) {
                        var count = children.length - 1;
                        var gid = 'replies-' + p.id;
                        html += '<div class="comment-replies-more" onclick="toggleReplies(this)" data-group="' + gid + '">展开 ' + count + ' 条回复 ▾</div>';
                        html += '<div class="comment-replies-all" id="' + gid + '" style="display:none">';
                        for (var i = 1; i < children.length; i++) {
                            html += renderNode(children[i], level + 1);
                        }
                        html += '</div>';
                    }
                    html += '</div>';
                }

                if (level === 0) {
                    html += '</div>';
                } else {
                    html += '</div>'; // close comment-reply-content
                    html += '</div>'; // close comment-reply-item
                }
                return html;
            }

            window.toggleReplies = function(btn) {
                var groupId = btn.getAttribute('data-group');
                var all = document.getElementById(groupId);
                if (!all) return;
                var visible = all.style.display !== 'none';
                all.style.display = visible ? 'none' : 'block';
                var count = all.children.length;
                btn.textContent = visible ? ('展开 ' + count + ' 条回复 ▾') : '收起 ▴';
            };

            function scrollToList() {
                document.getElementById('comments').scrollIntoView({ behavior: 'smooth', block: 'start' });
            }

            function escapeHtml(s) {
                var d = document.createElement('div');
                d.textContent = s;
                return d.innerHTML;
            }

            function formatCommentBody(body) {
                return body
                    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                    .replace(/`([^`]+)`/g, '<code>$1</code>')
                    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
                    .replace(/\*(.+?)\*/g, '<em>$1</em>')
                    .replace(/\n/g, '<br>');
            }

            // 初始化
            (async function init() {
                ghToken = loadToken();
                try {
                    var searchUrl = 'https://api.github.com/search/issues?q=repo:' + REPO + '+label:comment+' + encodeURIComponent(issueTerm) + '+in:title+type:issue&sort=created&order=desc';
                    var searchResp = await fetch(searchUrl, { headers: { 'Accept': 'application/vnd.github.v3+json' } });
                    var searchData = await searchResp.json();
                    if (searchData.items && searchData.items.length > 0) issueNumber = searchData.items[0].number;
                } catch (e) {}

                loadingEl.style.display = 'none';
                if (!issueNumber) { listEl.innerHTML = '<p class="comments-empty">暂无评论</p>'; listEl.style.display = 'block'; return; }
                try {
                    var resp = await fetch('https://api.github.com/repos/' + REPO + '/issues/' + issueNumber + '/comments', { headers: { 'Accept': 'application/vnd.github.v3+json' } });
                    allComments = await resp.json();
                } catch (e) {}
                renderAll(allComments);
            })();
        }
    </script>
</body>
</html>
