<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文章 | 蔡梓涵</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="apple-touch-icon" href="/favicon.svg">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav id="siteNav" data-extra="联系:index.html#contact"></nav>
    <script src="nav.js"></script>

    <article class="article-page" id="articleContent"></article>

    <section class="article-interactions" id="interactions">
        <div class="like-section">
            <button id="likeBtn" class="like-btn" onclick="toggleLike()">
                <span class="like-icon">👍</span>
                <span class="like-text">点赞</span>
                <span class="like-count" id="likeCount">0</span>
            </button>
        </div>
    </section>

    <section class="comments-section" id="comments">
        <h2>评论<span class="cmt-pv" id="articlePv"></span></h2>
        <!-- 刻意不带 .comment-host：term 要等文章数据回来才知道，
             由 mountComments() 设好 data-term 再挂载，避免被提前用错路径挂上 -->
        <div id="commentHost"></div>
    </section>

    <footer><p>&copy; 2026 蔡梓涵 · Powered by GitHub Pages</p></footer>

    <!-- 访问量占位（第三方计数脚本写入此处，再由页面取值渲染） -->
    <div style="display:none" aria-hidden="true">
        <span id="busuanzi_container_page_pv">本页访问量<span id="busuanzi_value_page_pv"></span>次</span>
    </div>

    <script src="sb.js"></script>
    <script src="user.js"></script>
    <script src="stats.js"></script>
    <script>
var CATS = { chat: '闲聊', tech: '技术', poetry: '诗词', game: '游戏' };

var params = new URLSearchParams(window.location.search);
var aid    = parseInt(params.get('id'), 10);
var isPost = params.get('type') === 'post';

// 文章与帖子共用这个页面，只是取数的表不同
var TABLE = isPost ? 'posts' : 'articles';
// 评论区按内容区分：文章 article-<id>，帖子 forum-<id>
var TERM  = (isPost ? 'forum-' : 'article-') + aid;

function eHtml(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }

function fm(md) {
    return ('<p>' + (md || '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/### (.+)/g, '<h4>$1</h4>')
        .replace(/## (.+)/g, '<h3>$1</h3>')
        .replace(/# (.+)/g, '<h2>$1</h2>')
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.+?)\*/g, '<em>$1</em>')
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/^> (.+)/gm, '<blockquote>$1</blockquote>')
        .replace(/^- (.+)/gm, '<li>$1</li>')
        .replace(/\n\n/g, '</p><p>').replace(/\n/g, '<br>') + '</p>');
}

function fmtDate(iso) { return String(iso || '').slice(0, 10); }

// 归属判断：只认服务端记录的 user_id，和昵称无关
function mine(row) { return !!(SB.user && row.user_id && row.user_id === SB.user.id); }

// ===== 删除 =====
// 服务端先确认这条属于你，再把内容连同它下面的评论一起删掉；
// 删掉就是数据库里没了，所有人（含未登录）都看不到。
window.deleteItem = function () {
    var what = isPost ? '这个帖子' : '这篇文章';
    window._showConfirm('删除' + what + '？删除后所有人都看不到了。', function () {
        SB.removeContent(TABLE, aid).then(function () {
            window.location.href = isPost ? 'forum.html' : 'blog.html';
        }).catch(function (e) {
            alert((e && e.message) || '删除失败，稍后再试');
        });
    });
};

// ===== 点赞（记在数据库里，所有人看得到）=====
window.toggleLike = function () {};

function initLike(row) {
    var btn   = document.getElementById('likeBtn');
    var span  = document.getElementById('likeCount');
    var text  = btn.querySelector('.like-text');
    var key   = 'liked_' + TABLE + '_' + aid;
    var liked = false;
    try { liked = localStorage.getItem(key) === '1'; } catch (e) {}

    var count = row.likes || 0;
    function paint() {
        span.textContent = count;
        btn.classList.toggle('liked', liked);
        text.textContent = liked ? '已赞' : '点赞';
    }
    paint();

    window.toggleLike = function () {
        if (liked) return;                       // 只加不减，避免反复点击刷数字
        liked = true;
        try { localStorage.setItem(key, '1'); } catch (e) {}
        count += 1;
        paint();
        var fn = isPost ? 'like_post' : 'like_article';
        SB.rpc(fn, { p_id: aid }).catch(function () {});
    };
}

// ===== 评论挂载 =====
// 只有内容确实存在时才挂，避免有人构造任意 id 凭空造出一堆空评论区
function mountComments() {
    var el = document.getElementById('commentHost');
    if (!el) return;
    el.setAttribute('data-term', TERM);
    el.className = 'comment-host';
    // comments.js 是同步脚本，正常此时已就绪；万一还没到，稍等重试，
    // 不再依赖 load 事件（load 已经过去的话就永远等不到了）。
    var tries = 0;
    (function go() {
        if (window._mountComments) { window._mountComments('#commentHost'); return; }
        if (++tries > 50) return;
        setTimeout(go, 100);
    })();
}

function notFound(msg) {
    document.getElementById('articleContent').innerHTML =
        '<div class="article-not-found"><h1>' + msg + '</h1><p><a href="' +
        (isPost ? 'forum.html' : 'blog.html') + '">← 返回' + (isPost ? '论坛' : '博客列表') + '</a></p></div>';
    document.getElementById('comments').style.display = 'none';
    document.getElementById('interactions').style.display = 'none';
}

function render(row) {
    var tags = (row.tags || []).map(function (t) { return '<span class="tag">' + eHtml(t) + '</span>'; }).join('');
    if (isPost) {
        tags = '<span class="tag">' + (CATS[row.category] || '闲聊') + '</span>';
    }
    // 删除按钮只在本人查看时出现。这只是界面上的便利，
    // 真正拦得住越权的是数据库里的行级策略。
    var delBtn = mine(row)
        ? '<button class="article-del-btn" onclick="deleteItem()" title="删除">🗑</button>'
        : '';
    var body = row.format === 'html' ? String(row.body || '') : fm(row.body);

    document.title = row.title + ' | 蔡梓涵';
    document.getElementById('articleContent').innerHTML =
        '<header class="article-header">' +
            '<div class="article-tags">' + tags + '</div>' +
            '<h1>' + eHtml(row.title) + '</h1>' +
            '<time>' + fmtDate(row.created_at) +
                (row.nickname ? ' · ' + eHtml(row.nickname) : '') + '</time>' +
            delBtn +
        '</header>' +
        '<div class="article-body">' + body + '</div>' +
        '<div class="article-back"><a href="' + (isPost ? 'forum.html' : 'blog.html') + '">← 返回' +
            (isPost ? '论坛' : '博客列表') + '</a></div>';

    initLike(row);
    mountComments();
    // 计数尽力而为，失败不影响阅读
    SB.rpc('bump_views', { p_table: TABLE, p_id: aid }).catch(function () {});
}

if (!aid || isNaN(aid)) {
    notFound('内容不存在');
} else {
    _trackRead(aid);
    window._onStatsReady = function (sitePv, pagePv) {
        if (pagePv) document.getElementById('articlePv').textContent = '· 阅读 ' + pagePv;
    };

    SB.select(TABLE, SB.q({
        select: '*', id: 'eq.' + aid, limit: '1'
    })).then(function (rows) {
        if (!rows || !rows.length) { notFound(isPost ? '帖子不存在' : '文章不存在'); return; }
        render(rows[0]);
    }).catch(function () {
        notFound('加载失败');
    });
}
    </script>
    <script src="theme.js"></script>
    <script src="music.js"></script>
    <script src="comments.js"></script>
    <script src="ux.js"></script>
</body>
</html>
