<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文章 | 蔡梓涵</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav>
        <div class="nav-inner">
            <a href="index.html" class="logo">Zihan</a>
            <div class="nav-links">
                <a href="index.html">首页</a>
                <a href="index.html#about">关于我</a>
                <a href="blog.html">博客</a>
                <a href="index.html#contact">联系</a>
            </div>
        </div>
    </nav>

    <article class="article-page" id="articleContent">
        <!-- JS 动态生成 -->
    </article>

    <section class="article-interactions" id="interactions">
        <!-- 点赞 -->
        <div class="like-section">
            <button id="likeBtn" class="like-btn" onclick="toggleLike()">
                <span class="like-icon">👍</span>
                <span class="like-text">点赞</span>
                <span class="like-count" id="likeCount">0</span>
            </button>
        </div>
    </section>

    <section class="comments-section" id="comments">
        <h2>评论</h2>

        <!-- 加载中 -->
        <div class="comments-loading" id="commentsLoading">
            <div class="loading-spinner"></div>
            <p>正在加载评论...</p>
        </div>

        <!-- 评论列表 -->
        <div id="comments-list" style="display:none"></div>

        <!-- 写评论按钮 -->
        <div class="comment-action" id="commentAction" style="display:none">
            <a id="commentLink" href="#" target="_blank" class="comment-action-btn">
                💬 在 GitHub 上评论
            </a>
            <p class="comments-note">评论需要 GitHub 账号，会保存在 GitHub Issue 中</p>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 蔡梓涵 · Powered by GitHub Pages</p>
    </footer>

    <script src="blog-data.js"></script>
    <script>
        // 获取文章 ID
        const params = new URLSearchParams(window.location.search);
        const articleId = parseInt(params.get('id'));

        // 查找文章
        const article = articles.find(a => a.id === articleId);

        if (!article) {
            document.getElementById('articleContent').innerHTML = `
                <div class="article-not-found">
                    <h1>文章不存在</h1>
                    <p><a href="blog.html">← 返回博客列表</a></p>
                </div>
            `;
        } else {
            // 设置标题
            document.title = `${article.title} | 蔡梓涵`;
            document.querySelector('meta[name="description"]')?.setAttribute('content', article.summary);

            // 渲染文章
            document.getElementById('articleContent').innerHTML = `
                <header class="article-header">
                    <div class="article-tags">
                        ${article.tags.map(t => `<span class="tag">${t}</span>`).join('')}
                    </div>
                    <h1>${article.title}</h1>
                    <time>${article.date}</time>
                </header>
                <div class="article-body">
                    ${article.content}
                </div>
                <div class="article-back">
                    <a href="blog.html">← 返回博客列表</a>
                </div>
            `;

            // 点赞系统
            const storageKey = `likes_${articleId}`;
            let liked = localStorage.getItem(`${storageKey}_liked`) === 'true';
            let count = parseInt(localStorage.getItem(storageKey) || '0');

            function updateLikeUI() {
                document.getElementById('likeCount').textContent = count;
                const btn = document.getElementById('likeBtn');
                if (liked) {
                    btn.classList.add('liked');
                    btn.querySelector('.like-text').textContent = '已赞';
                } else {
                    btn.classList.remove('liked');
                    btn.querySelector('.like-text').textContent = '点赞';
                }
            }

            window.toggleLike = function() {
                if (liked) {
                    count = Math.max(0, count - 1);
                    liked = false;
                } else {
                    count++;
                    liked = true;
                }
                localStorage.setItem(storageKey, count);
                localStorage.setItem(`${storageKey}_liked`, liked);
                updateLikeUI();
            };

            updateLikeUI();

            // 评论区 - 通过 GitHub Issues API 直接加载
            (async function loadComments() {
                const issueTerm = 'article-' + articleId;
                const loadingEl = document.getElementById('commentsLoading');
                const listEl = document.getElementById('comments-list');
                const actionEl = document.getElementById('commentAction');
                const linkEl = document.getElementById('commentLink');

                try {
                    // 搜索对应 Issue
                    const searchUrl = `https://api.github.com/search/issues?q=repo:yjcc520/my-page+label:comment+${encodeURIComponent(issueTerm)}+in:title+type:issue&sort=created&order=desc`;
                    const searchResp = await fetch(searchUrl, {
                        headers: { 'Accept': 'application/vnd.github.v3+json' }
                    });
                    const searchData = await searchResp.json();

                    let issueNumber = null;
                    if (searchData.items && searchData.items.length > 0) {
                        issueNumber = searchData.items[0].number;
                    }

                    if (issueNumber) {
                        // 加载评论
                        const commentsResp = await fetch(
                            `https://api.github.com/repos/yjcc520/my-page/issues/${issueNumber}/comments`,
                            { headers: { 'Accept': 'application/vnd.github.v3+json' } }
                        );
                        const comments = await commentsResp.json();

                        loadingEl.style.display = 'none';

                        if (comments.length === 0) {
                            listEl.innerHTML = '<p class="comments-empty">暂无评论，来做第一个评论的人吧 👇</p>';
                        } else {
                            listEl.innerHTML = comments.map(c => `
                                <div class="comment-item">
                                    <div class="comment-header">
                                        <img class="comment-avatar" src="${c.user.avatar_url}" alt="" width="36" height="36">
                                        <div>
                                            <a class="comment-author" href="${c.user.html_url}" target="_blank">${c.user.login}</a>
                                            <span class="comment-time">${new Date(c.created_at).toLocaleDateString('zh-CN')}</span>
                                        </div>
                                    </div>
                                    <div class="comment-body">${formatCommentBody(c.body)}</div>
                                </div>
                            `).join('');
                        }

                        linkEl.href = searchData.items[0].html_url;
                        linkEl.textContent = `💬 在 GitHub 上评论（${comments.length} 条评论）`;
                        actionEl.style.display = 'block';
                        listEl.style.display = 'block';
                    } else {
                        // 没有 Issue，显示引导创建
                        loadingEl.style.display = 'none';
                        listEl.innerHTML = '<p class="comments-empty">还没有评论</p>';
                        linkEl.href = `https://github.com/yjcc520/my-page/issues/new?title=${encodeURIComponent(issueTerm)}&labels=comment&body=${encodeURIComponent('> 本文：' + window.location.href + '\n\n欢迎留下你的想法 👇')}`;
                        linkEl.textContent = '💬 成为第一个评论的人';
                        actionEl.style.display = 'block';
                        listEl.style.display = 'block';
                    }
                } catch (e) {
                    loadingEl.innerHTML = '<p class="comments-error">评论加载失败，请刷新重试</p>';
                }
            })();

            function formatCommentBody(body) {
                // 简单 Markdown 转 HTML
                return body
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/`([^`]+)`/g, '<code>$1</code>')
                    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
                    .replace(/\*(.+?)\*/g, '<em>$1</em>')
                    .replace(/\n/g, '<br>');
            }
        }
    </script>
</body>
</html>
