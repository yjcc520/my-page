<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>画廊 | 蔡梓涵</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="apple-touch-icon" href="/favicon.svg">
<link rel="stylesheet" href="styles.css">
<style>
.gallery-page { padding: 6rem 2rem 4rem; max-width: 1000px; margin: 0 auto; min-height: 70vh; }
.gallery-header { text-align: center; margin-bottom: 2rem; }
.gallery-header h1 { font-size: 2rem; margin-bottom: 0.3rem; }
.gallery-header p { color: var(--text-light); }
.gallery-upload { text-align: center; margin-bottom: 2rem; }
.gallery-upload-btn {
  display: inline-block; padding: 0.6rem 1.5rem; background: var(--primary);
  color: #fff; border: none; border-radius: 8px; font-size: 0.95rem;
  cursor: pointer; font-family: inherit; transition: background 0.15s;
}
.gallery-upload-btn:hover { background: var(--primary-light); }
.gallery-upload-hint { margin-top: 0.6rem; font-size: 0.78rem; color: var(--text-light); }
.gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1rem; }
.gallery-item {
  position: relative; border-radius: 10px; overflow: hidden;
  aspect-ratio: 1; background: var(--bg-alt); border: 1px solid var(--border);
  cursor: pointer; transition: transform 0.15s;
}
.gallery-item:hover { transform: scale(1.02); }
.gallery-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
.gallery-item .gl-uploader { position: absolute; bottom: 6px; right: 6px; font-size: 0.7rem; background: rgba(0,0,0,0.6); color: #ccc; padding: 2px 8px; border-radius: 10px; }
.gallery-empty { text-align: center; color: var(--text-light); padding: 3rem; }

/* Lightbox */
.lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 1000; justify-content: center; align-items: center; }
.lightbox.active { display: flex; }
.lightbox img { max-width: 90vw; max-height: 85vh; border-radius: 8px; box-shadow: 0 0 60px rgba(0,0,0,0.5); }
.lightbox-close { position: absolute; top: 20px; right: 30px; color: #fff; font-size: 32px; cursor: pointer; z-index: 1001; background: none; border: none; }

/* 评论区 */
.gallery-comments { margin-top: 3.5rem; }
.gallery-comments h2 { text-align: center; font-size: 1.25rem; margin-bottom: 0.3rem; }
.gallery-comments .gc-sub { text-align: center; color: var(--text-light); font-size: 0.83rem; margin-bottom: 1.2rem; }
</style>
</head>
<body>
<nav>
  <div class="nav-inner">
    <a href="index.html" class="logo">Zihan</a>
    <div class="nav-links">
      <a href="index.html">首页</a>
      <a href="blog.html">博客</a>
      <a href="gallery.html" class="active">画廊</a>
      <a href="forum.html">论坛</a>
      <a href="games.html">小游戏</a>
      <button class="theme-toggle" onclick="_toggleTheme()" title="切换主题">☀️</button>
    </div>
  </div>
</nav>

<div class="gallery-page">
  <div class="gallery-header">
    <h1>画廊</h1>
    <p>生活中的美好瞬间</p>
  </div>
  <div class="gallery-upload">
    <button class="gallery-upload-btn" onclick="openGalleryIssue()">＋ 添加照片（站长）</button>
    <p class="gallery-upload-hint">在 GitHub 的「图库」话题下留言并粘贴图片，画廊会自动收录</p>
  </div>
  <div class="gallery-grid" id="galleryGrid">
    <p class="gallery-empty">加载中...</p>
  </div>

  <div class="gallery-comments">
    <h2>说说你的想法</h2>
    <p class="gc-sub">用 GitHub 账号登录即可留言</p>
    <div class="giscus-host" data-giscus-term="gallery"></div>
  </div>
</div>

<footer><p>&copy; 2026 蔡梓涵</p></footer>

<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <button class="lightbox-close">✕</button>
  <img id="lightboxImg" src="" alt="">
</div>

<script src="user.js"></script>
<script src="theme.js"></script>
<script src="music.js"></script>
<script>
var GALLERY_ISSUE = null;
var REPO = 'yjcc520/my-page';

// 画廊内容存放在仓库「图库」话题的留言里，读取是公开的，不需要任何凭据
async function getGalleryIssue() {
  try {
    var r = await fetch('https://api.github.com/search/issues?q=repo:' + REPO + '+label:gallery+in:title+type:issue', {
      headers: { 'Accept': 'application/vnd.github.v3+json' }
    });
    var d = await r.json();
    if (d.items && d.items.length) GALLERY_ISSUE = d.items[0].number;
  } catch (e) {}
}

// 站长添加照片：跳到 GitHub 对应的图库话题
window.openGalleryIssue = function () {
  var url = GALLERY_ISSUE
    ? 'https://github.com/' + REPO + '/issues/' + GALLERY_ISSUE
    : 'https://github.com/' + REPO + '/issues?q=label%3Agallery';
  window.open(url, '_blank', 'noopener');
};

async function loadGallery() {
  if (!GALLERY_ISSUE) await getGalleryIssue();
  var grid = document.getElementById('galleryGrid');
  if (!GALLERY_ISSUE) { grid.innerHTML = '<p class="gallery-empty">暂无图片</p>'; return; }
  try {
    var r = await fetch('https://api.github.com/repos/' + REPO + '/issues/' + GALLERY_ISSUE + '/comments?per_page=100', {
      headers: { 'Accept': 'application/vnd.github.v3+json' }
    });
    var comments = await r.json();
    if (!comments.length) {
      grid.innerHTML = '<p class="gallery-empty">还没有图片，来上传第一张吧 📷</p>';
      return;
    }
    grid.innerHTML = comments.map(function (c) {
      var img = c.body, uploader = '';
      try { var info = JSON.parse(c.body); img = info.url; uploader = info.by || ''; } catch (ex) {}
      if (!img || (img.indexOf('http') !== 0 && img.indexOf('data:image') !== 0)) return '';
      return '<div class="gallery-item" onclick="openLightbox(\'' + img + '\')">' +
        '<img src="' + img + '" alt="" loading="lazy">' +
        (uploader ? '<span class="gl-uploader">' + uploader + '</span>' : '') +
        '</div>';
    }).filter(Boolean).join('');
  } catch (e) {
    grid.innerHTML = '<p class="gallery-empty">加载失败</p>';
  }
}

// Lightbox
var _lbImages = [];
window.openLightbox = function (src) {
  document.getElementById('lightboxImg').src = src;
  document.getElementById('lightbox').classList.add('active');
  _lbImages = Array.prototype.slice.call(document.querySelectorAll('.gallery-item img')).map(function (el) { return el.src; });
};
window.closeLightbox = function () {
  document.getElementById('lightbox').classList.remove('active');
};
document.addEventListener('keydown', function (e) {
  var lb = document.getElementById('lightbox');
  if (!lb.classList.contains('active')) return;
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
    e.stopPropagation();
    var cur = _lbImages.indexOf(document.getElementById('lightboxImg').src);
    if (cur < 0) return;
    var next = e.key === 'ArrowRight'
      ? (cur + 1) % _lbImages.length
      : (cur - 1 + _lbImages.length) % _lbImages.length;
    document.getElementById('lightboxImg').src = _lbImages[next];
  }
});

getGalleryIssue().then(loadGallery);
</script>
<script src="comments.js"></script>
<script src="ux.js"></script>
</body>
</html>
