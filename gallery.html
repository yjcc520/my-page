<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>画廊 | 蔡梓涵</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="apple-touch-icon" href="/favicon.svg">
<link rel="stylesheet" href="styles.css">
<style>
.gallery-page { padding: 6rem 2rem 4rem; max-width: 1000px; margin: 0 auto; min-height: 70vh; }
.gallery-header { text-align: center; margin-bottom: 2rem; }
.gallery-header h1 { font-size: 2rem; margin-bottom: 0.3rem; }
.gallery-header p { color: var(--text-light); }
.gallery-upload { text-align: center; margin-bottom: 2rem; }
.gallery-upload-btn {
  display: inline-block; padding: 0.6rem 1.5rem; background: var(--primary);
  color: #fff; border: none; border-radius: 8px; font-size: 0.95rem;
  cursor: pointer; font-family: inherit; transition: background 0.15s;
}
.gallery-upload-btn:hover { background: var(--primary-light); }
.gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1rem; }
.gallery-item {
  position: relative; border-radius: 10px; overflow: hidden;
  aspect-ratio: 1; background: var(--bg-alt); border: 1px solid var(--border);
  cursor: pointer; transition: transform 0.15s;
}
.gallery-item:hover { transform: scale(1.02); }
.gallery-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
.gallery-item .gl-uploader { position: absolute; bottom: 6px; right: 6px; font-size: 0.7rem; background: rgba(0,0,0,0.6); color: #ccc; padding: 2px 8px; border-radius: 10px; }
.gallery-item .gl-del {
  position: absolute; top: 6px; right: 6px; width: 24px; height: 24px; line-height: 1;
  border: none; border-radius: 50%; background: rgba(0,0,0,0.55); color: #fff;
  font-size: 0.8rem; cursor: pointer; opacity: 0; transition: opacity 0.15s; font-family: inherit;
}
.gallery-item:hover .gl-del { opacity: 1; }
.gallery-upload-btn { cursor: pointer; }
.gallery-empty { text-align: center; color: var(--text-light); padding: 3rem; }

/* Lightbox */
.lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 1000; justify-content: center; align-items: center; }
.lightbox.active { display: flex; }
.lightbox img { max-width: 90vw; max-height: 85vh; border-radius: 8px; box-shadow: 0 0 60px rgba(0,0,0,0.5); }
.lightbox-close { position: absolute; top: 20px; right: 30px; color: #fff; font-size: 32px; cursor: pointer; z-index: 1001; background: none; border: none; }

/* 评论区 */
.gallery-comments { margin-top: 3.5rem; }
.gallery-comments h2 { text-align: center; font-size: 1.25rem; margin-bottom: 1.2rem; }
</style>
</head>
<body>
<nav id="siteNav"></nav>
<script src="nav.js"></script>

<div class="gallery-page">
  <div class="gallery-header">
    <h1>画廊</h1>
    <p>生活中的美好瞬间</p>
  </div>
  <div class="gallery-upload">
    <label class="gallery-upload-btn" for="galleryPick">＋ 添加照片</label>
    <input type="file" id="galleryPick" accept="image/*" multiple hidden>
  </div>
  <div class="gallery-grid" id="galleryGrid">
    <p class="gallery-empty">加载中...</p>
  </div>

  <div class="gallery-comments">
    <h2>评论</h2>
    <div class="comment-host" data-term="gallery"></div>
  </div>
</div>

<footer><p>&copy; 2026 蔡梓涵</p></footer>

<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <button class="lightbox-close">✕</button>
  <img id="lightboxImg" src="" alt="">
</div>

<script src="sb.js"></script>
<script src="user.js"></script>
<script src="theme.js"></script>
<script src="music.js"></script>
<script>
var GALLERY_BUCKET = 'gallery';

/* ---- 读取：库里存元数据（路径 + 上传者），图片本身在 Storage ---- */
async function loadGallery() {
  var grid = document.getElementById('galleryGrid');
  grid.innerHTML = '<p class="gallery-empty">加载中...</p>';
  try {
    var rows = await SB.select('photos', 'select=id,url,uploader,caption,user_id&order=created_at.desc&limit=300');
    if (!rows || !rows.length) {
      grid.innerHTML = '<p class="gallery-empty">还没有照片</p>';
      return;
    }
    grid.innerHTML = rows.map(function (p) {
      var full = SB.publicUrl(GALLERY_BUCKET, p.url);
      var cap = p.caption ? ' title="' + esc(p.caption) + '"' : '';
      return '<div class="gallery-item" data-id="' + p.id + '"' + cap + '>' +
        '<img src="' + full + '" alt="" loading="lazy">' +
        (p.uploader ? '<span class="gl-uploader">' + esc(p.uploader) + '</span>' : '') +
        (p.user_id ? '<button class="gl-del" data-id="' + p.id + '" title="删除">✕</button>' : '') +
        '</div>';
    }).join('');
  } catch (e) {
    grid.innerHTML = '<p class="gallery-empty">加载失败</p>';
  }
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

/* ---- 上传 ---- */
async function uploadPhotos(files) {
  if (!SB.loggedIn) { openAccountPanel(); return; }
  var grid = document.getElementById('galleryGrid');
  for (var i = 0; i < files.length; i++) {
    var f = files[i];
    if (!/^image\//.test(f.type)) continue;
    if (f.size > 5 * 1024 * 1024) { toastG('「' + f.name + '」超过 5MB'); continue; }
    try {
      // 路径首段用 uid，与 Storage 策略里的属主目录一致
      var path = SB.user.id + '/' + Date.now() + '-' + Math.random().toString(36).slice(2, 8) +
        '.' + (f.name.split('.').pop() || 'jpg').toLowerCase();
      await SB.upload(GALLERY_BUCKET, path, f);
      await SB.insert('photos', { url: path, uploader: '', caption: '', user_id: null });
      toastG('已上传');
    } catch (e) {
      toastG((e && e.message) || '上传失败');
    }
  }
  loadGallery();
}

function toastG(msg) {
  var d = document.createElement('div');
  d.textContent = msg;
  d.style.cssText = 'position:fixed;left:50%;bottom:32px;transform:translateX(-50%);' +
    'background:rgba(30,41,59,0.92);color:#fff;padding:0.55rem 1.1rem;border-radius:10px;' +
    'font-size:0.85rem;z-index:9999;pointer-events:none;font-family:inherit';
  document.body.appendChild(d);
  setTimeout(function () { if (d.parentNode) d.parentNode.removeChild(d); }, 2200);
}

/* ---- Lightbox ---- */
var _lbImages = [];
function openLightbox(src) {
  document.getElementById('lightboxImg').src = src;
  document.getElementById('lightbox').classList.add('active');
  _lbImages = Array.prototype.slice.call(document.querySelectorAll('.gallery-item img')).map(function (el) { return el.src; });
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('active');
}
document.addEventListener('keydown', function (e) {
  var lb = document.getElementById('lightbox');
  if (!lb.classList.contains('active')) return;
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
    e.stopPropagation();
    var cur = _lbImages.indexOf(document.getElementById('lightboxImg').src);
    if (cur < 0) return;
    var next = e.key === 'ArrowRight'
      ? (cur + 1) % _lbImages.length
      : (cur - 1 + _lbImages.length) % _lbImages.length;
    document.getElementById('lightboxImg').src = _lbImages[next];
  }
});

/* ---- 交互绑定（只绑一次） ---- */
document.getElementById('galleryGrid').addEventListener('click', async function (e) {
  var del = e.target.closest('.gl-del');
  if (del) {
    e.stopPropagation();
    if (!confirm('删除这张照片？')) return;
    var id = del.getAttribute('data-id');
    var item = del.closest('.gallery-item');
    var rel = item.querySelector('img').src.split('/' + GALLERY_BUCKET + '/').pop();
    try {
      await SB.remove('photos', id);
      // 图片本体也删掉；失败不影响记录已删（Storage 策略只允许删自己目录）
      try { await SB.removeStorage(GALLERY_BUCKET, decodeURIComponent(rel)); } catch (x) {}
      item.remove();
      toastG('已删除');
    } catch (x) { toastG('删除失败'); }
    return;
  }
  var img = e.target.closest('img');
  if (img) openLightbox(img.src);
});

document.getElementById('galleryPick').addEventListener('change', function (e) {
  uploadPhotos(e.target.files);
  e.target.value = '';
});

loadGallery();
</script>
<script src="comments.js"></script>
<script src="ux.js"></script>
</body>
</html>
