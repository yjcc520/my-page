<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="蔡梓涵的博客">
    <title>博客 | 蔡梓涵</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="apple-touch-icon" href="/favicon.svg">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav>
        <div class="nav-inner">
            <a href="index.html" class="logo">Zihan</a>
            <div class="nav-links">
                <a href="index.html">首页</a>
                <a href="index.html#about">关于我</a>
                <a href="blog.html" class="active">博客</a>
                <a href="gallery.html">画廊</a>
                <a href="forum.html">论坛</a>
                <a href="games.html">小游戏</a>
                <button class="theme-toggle" onclick="_toggleTheme()" title="切换主题">☀️</button>
            </div>
        </div>
    </nav>

    <section class="blog-page">
        <div class="blog-header">
            <h1>博客</h1>
            <p>记录思考，分享成长</p>
            <button class="blog-write-btn" onclick="window.location.href='write.html'">✏️ 写文章</button>
            <a href="tags.html" style="display:inline-block;margin-left:0.5rem;padding:0.5rem 1.2rem;border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-light);text-decoration:none;font-size:0.9rem;font-weight:500;transition:all 0.15s;" onmouseover="this.style.borderColor='var(--primary)';this.style.color='var(--primary)'" onmouseout="this.style.borderColor='var(--border)';this.style.color='var(--text-light)'">🏷️ 标签分类</a>
        </div>
        <div class="blog-list" id="blogList">
            <!-- JS 动态生成 -->
        </div>
    </section>

    <footer>
        <p>&copy; 2026 蔡梓涵 · Powered by GitHub Pages</p>
    </footer>

    <script src="sb.js"></script>
    <script src="user.js"></script>
    <script>
        var LIST_FIELDS = 'id,title,tags,body,format,nickname,created_at,user_id';

        function escapeHtml(s) {
            var d = document.createElement('div');
            d.textContent = s == null ? '' : String(s);
            return d.innerHTML;
        }

        // 归属判断：只认服务端记录的 user_id，与昵称无关，改昵称冒充不了
        function mine(row) {
            return !!(SB.user && row.user_id && row.user_id === SB.user.id);
        }

        function fmtDate(iso) {
            var dt = new Date(iso);
            var p = function (n) { return (n < 10 ? '0' : '') + n; };
            return dt.getFullYear() + '-' + p(dt.getMonth() + 1) + '-' + p(dt.getDate());
        }

        // 摘要：把 HTML / Markdown 的标记剃掉，取前 110 字
        function summaryOf(row) {
            var t = String(row.body || '')
                .replace(/<[^>]*>/g, ' ')
                .replace(/[#*>`_~\-]+/g, ' ')
                .replace(/\s+/g, ' ')
                .trim();
            return t.length > 110 ? t.slice(0, 110) + '…' : t;
        }

        function renderArticleCard(a) {
            var tags = (a.tags || []).map(function (t) {
                return '<span class="tag">' + escapeHtml(t) + '</span>';
            }).join('');
            var delBtn = mine(a)
                ? '<button class="blog-del-btn" onclick="delArticle(' + a.id + ',this)" title="删除这篇文章">✕</button>'
                : '';
            return '<article class="blog-card' + (mine(a) ? ' blog-card-user' : '') + '">' +
                delBtn +
                '<div class="blog-card-tags">' + tags + '</div>' +
                '<h2><a href="article.html?id=' + a.id + '">' + escapeHtml(a.title) + '</a></h2>' +
                '<div class="blog-meta">' +
                    '<time>' + fmtDate(a.created_at) + '</time>' +
                    (a.nickname ? '<span class="blog-author">' + escapeHtml(a.nickname) + '</span>' : '') +
                '</div>' +
                '<p class="blog-card-summary">' + escapeHtml(summaryOf(a)) + '</p>' +
                '<a href="article.html?id=' + a.id + '" class="read-more">阅读全文 →</a>' +
                '</article>';
        }

        function loadArticles() {
            var list = document.getElementById('blogList');
            if (!list.getAttribute('data-ready')) list.innerHTML = '<p class="comments-empty">加载中…</p>';

            SB.select('articles', SB.q({
                select: LIST_FIELDS, order: 'created_at.desc', limit: '200'
            })).then(function (rows) {
                rows = rows || [];
                list.setAttribute('data-ready', '1');
                list.innerHTML = rows.length
                    ? rows.map(renderArticleCard).join('')
                    : '<p class="comments-empty">还没有文章</p>';
                if (window._uxObserve) window._uxObserve(list);
            }).catch(function () {
                list.innerHTML = '<p class="comments-empty">加载失败，刷新重试</p>';
            });
        }

        // 删除：服务端会先确认这条属于你，再把文章连同它下面的评论一起删掉。
        // 删完别人也看不到，不是只在本机隐藏。
        window.delArticle = function (id, btn) {
            var card = btn && btn.closest ? btn.closest('.blog-card') : null;
            var title = card ? (card.querySelector('h2') || {}).textContent : '';
            window._showConfirm('删除《' + (title || '这篇文章') + '》？删除后所有人都看不到了。', function () {
                if (btn) btn.disabled = true;
                SB.removeContent('articles', Number(id)).then(function () {
                    loadArticles();
                }).catch(function (e) {
                    if (btn) btn.disabled = false;
                    alert((e && e.message) || '删除失败，稍后再试');
                });
            });
        };

        // 登录状态一变就重画，删除按钮只对自己发的文章出现（onChange 会立刻先触发一次）
        SB.onChange(function () { loadArticles(); });
    </script>
    <script src="theme.js"></script>
    <script src="music.js"></script>
    <script src="ux.js"></script>
</body>
</html>
