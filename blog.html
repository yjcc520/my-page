<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="蔡梓涵的博客">
    <title>博客 | 蔡梓涵</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="apple-touch-icon" href="/favicon.svg">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav>
        <div class="nav-inner">
            <a href="index.html" class="logo">Zihan</a>
            <div class="nav-links">
                <a href="index.html">首页</a>
                <a href="index.html#about">关于我</a>
                <a href="blog.html" class="active">博客</a>
                <a href="gallery.html">画廊</a>
                <a href="forum.html">论坛</a>
                <a href="games.html">小游戏</a>
                <button class="theme-toggle" onclick="_toggleTheme()" title="切换主题">☀️</button>
            </div>
        </div>
    </nav>

    <section class="blog-page">
        <div class="blog-header">
            <h1>博客</h1>
            <p>记录思考，分享成长</p>
            <button class="blog-write-btn" onclick="window.location.href='write.html'">✏️ 写文章</button>
            <a href="tags.html" style="display:inline-block;margin-left:0.5rem;padding:0.5rem 1.2rem;border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text-light);text-decoration:none;font-size:0.9rem;font-weight:500;transition:all 0.15s;" onmouseover="this.style.borderColor='var(--primary)';this.style.color='var(--primary)'" onmouseout="this.style.borderColor='var(--border)';this.style.color='var(--text-light)'">🏷️ 标签分类</a>
        </div>
        <div class="blog-list" id="blogList">
            <!-- JS 动态生成 -->
        </div>
    </section>

    <footer>
        <p>&copy; 2026 蔡梓涵 · Powered by GitHub Pages</p>
    </footer>

    <script src="blog-data.js"></script>
    <script src="user.js"></script>
    <script src="gh-publish.js"></script>
    <script>
        function escapeHtml(s) {
            var d = document.createElement('div');
            d.textContent = s;
            return d.innerHTML;
        }

        // 删除文章：关闭 Issue 属于仓库权限操作，改为跳到 GitHub；预置文章则记在本地
        window.deleteBlog = function (delId) {
            if (delId.indexOf('preset-') === 0) {
                var key = delId.replace('preset-', '');
                window._showConfirm('确定隐藏这篇文章吗？（仅对当前浏览器生效）', function () {
                    var list = [];
                    try { list = JSON.parse(localStorage.getItem('deleted_presets') || '[]'); } catch (e) {}
                    if (list.indexOf(key) < 0) list.push(key);
                    localStorage.setItem('deleted_presets', JSON.stringify(list));
                    loadArticles();
                });
                return;
            }
            window._showConfirm('删除需要到 GitHub 上关闭这篇 Issue，现在打开吗？', function () {
                window.open(window._ghIssueUrl(delId.replace('issue-', '')), '_blank', 'noopener');
            });
        };

        // 渲染文章卡片
        function renderArticleCard(a) {
            var tagsHtml = (a.tags || []).map(function (t) { return '<span class="tag">' + escapeHtml(t) + '</span>'; }).join('');
            var delBtn = a.delId ? '<button class="blog-del-btn" onclick="deleteBlog(\'' + a.delId + '\')" title="删除">✕</button>' : '';
            var authorHtml = a.author ? '<span class="blog-author">' + escapeHtml(a.author) + '</span>' : '';
            var href = 'article.html?id=' + a.id + (a.issueId ? '&type=issue' : '');
            return '<article class="blog-card' + (a.issueId ? ' blog-card-user' : '') + '">' +
                delBtn +
                '<div class="blog-card-tags">' + tagsHtml + '</div>' +
                '<h2><a href="' + href + '">' + escapeHtml(a.title) + '</a></h2>' +
                '<div class="blog-meta"><time>' + a.date + '</time>' + authorHtml + '</div>' +
                '<p class="blog-card-summary">' + escapeHtml(a.summary) + '</p>' +
                '<a href="' + href + '" class="read-more">阅读全文 →</a>' +
                '</article>';
        }

        async function loadArticles() {
            var list = document.getElementById('blogList');
            var all = [];

            // 本地隐藏的预置文章
            var deletedPreset = [];
            try { deletedPreset = JSON.parse(localStorage.getItem('deleted_presets') || '[]'); } catch (e) {}

            // 预置文章
            articles.forEach(function (a) {
                if (deletedPreset.indexOf(String(a.id)) >= 0) return;
                all.push({ id: a.id, title: a.title, date: a.date, summary: a.summary, tags: a.tags, issueId: false, author: '蔡梓涵', delId: 'preset-' + a.id });
            });

            // GitHub Issues 文章（公开读取，不需要凭据）
            try {
                var resp = await fetch('https://api.github.com/search/issues?q=repo:yjcc520/my-page+label:article+type:issue+state:open&sort=created&order=desc&per_page=50', {
                    headers: { 'Accept': 'application/vnd.github.v3+json' }
                });
                var data = await resp.json();
                (data.items || []).forEach(function (issue) {
                    var author = '匿名', tagList = [];
                    var body = issue.body || '';
                    var am = body.match(/\*\*作者\*\*[：:]\s*(.+)/);
                    if (am) author = am[1].trim();
                    var tm = body.match(/\*\*标签\*\*[：:]\s*(.+)/);
                    if (tm) tagList = tm[1].split(/[,，]/).map(function (t) { return t.trim(); }).filter(Boolean);
                    var content = body.replace(/\*\*作者\*\*[：:].+\n?/, '').replace(/\*\*标签\*\*[：:].+\n?/, '').trim();
                    var summary = content.replace(/[#*>\n`]/g, '').substring(0, 120) + '...';
                    all.push({
                        id: issue.number, title: issue.title, date: issue.created_at.split('T')[0],
                        summary: summary, tags: tagList, issueId: true, author: author, delId: 'issue-' + issue.number
                    });
                });
            } catch (e) {}

            list.innerHTML = all.length
                ? all.map(renderArticleCard).join('')
                : '<p class="comments-empty">还没有文章</p>';

            setTimeout(function () { if (window._uxObserve) window._uxObserve(list); }, 50);
        }

        loadArticles();
    </script>
    <script src="theme.js"></script>
    <script src="music.js"></script>
    <script src="ux.js"></script>
</body>
</html>
