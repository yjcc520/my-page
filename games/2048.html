<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2048 | 蔡梓涵</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#faf8ef;display:flex;justify-content:center;align-items:center;height:100vh}
.container{text-align:center;width:90%;max-width:420px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:0.5rem}
h1{font-size:2.5rem;color:#776e65;margin:0}
.scores{display:flex;gap:0.5rem}
.score-box{background:#bbada0;color:#fff;padding:0.3rem 1rem;border-radius:6px;text-align:center}
.score-box .label{font-size:0.65rem;text-transform:uppercase;opacity:0.8}
.score-box .val{font-size:1.3rem;font-weight:700}
.sub{color:#776e65;margin-bottom:0.8rem;font-size:0.9rem}
.grid{position:relative;width:100%;aspect-ratio:1;background:#bbada0;border-radius:8px;padding:7px;display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.cell{background:rgba(238,228,218,0.35);border-radius:5px;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.4rem;transition:all 0.1s}
.c2{background:#eee4da;color:#776e65}.c4{background:#ede0c8;color:#776e65}
.c8{background:#f2b179;color:#f9f6f2}.c16{background:#f59563;color:#f9f6f2}
.c32{background:#f67c5f;color:#f9f6f2}.c64{background:#f65e3b;color:#f9f6f2}
.c128{background:#edcf72;color:#f9f6f2;font-size:1.2rem}.c256{background:#edcc61;color:#f9f6f2;font-size:1.2rem}
.c512{background:#edc850;color:#f9f6f2;font-size:1.2rem}.c1024{background:#edc53f;color:#f9f6f2;font-size:1rem}
.c2048{background:#edc22e;color:#f9f6f2;font-size:1rem}.c4096{background:#3c3a32;color:#f9f6f2;font-size:0.9rem}
.btn-row{display:flex;gap:0.5rem;justify-content:center;margin-top:1rem}
.btn{background:#8f7a66;color:#f9f6f2;border:none;padding:0.6rem 1.2rem;border-radius:6px;font-size:0.9rem;font-weight:600;cursor:pointer}
/* LB */
.lb-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);display:none;justify-content:center;align-items:center;z-index:100}
.lb-overlay.show{display:flex}
.lb-panel{background:#faf8ef;border-radius:12px;width:90%;max-width:380px;max-height:80vh;overflow-y:auto;padding:1.5rem;box-shadow:0 4px 20px rgba(0,0,0,0.2)}
.lb-panel h3{text-align:center;color:#776e65;margin-bottom:1rem}
.lb-item{display:flex;align-items:center;padding:0.5rem 0.8rem;border-bottom:1px solid #eee;font-size:0.9rem;color:#776e65}
.lb-item:last-child{border-bottom:none}
.lb-rank{width:30px;color:#bbada0;font-weight:700;flex-shrink:0}
.lb-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-score{color:#8f7a66;font-weight:700;flex-shrink:0}
.lb-placeholder{text-align:center;color:#999;padding:1.5rem 0}
.lb-me{background:rgba(143,122,102,0.08);border-radius:6px}
.lb-close{display:block;margin:1rem auto 0;background:#bbada0;color:#fff;border:none;padding:0.5rem 2rem;border-radius:6px;cursor:pointer}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>2048</h1>
    <div class="scores">
      <div class="score-box"><div class="label">分数</div><div class="val" id="score">0</div></div>
      <div class="score-box"><div class="label">最高</div><div class="val" id="best">0</div></div>
    </div>
  </div>
  <p class="sub">方向键或滑动合并数字，��出 2048</p>
  <div class="grid" id="grid"></div>
  <div class="btn-row">
    <button class="btn" onclick="newGame()">新游戏</button>
    <button class="btn" onclick="showLB()">🏆 排行</button>
  </div>
</div>
<div class="lb-overlay" id="lbOverlay">
  <div class="lb-panel">
    <h3>2048 — 排行榜</h3>
    <div id="lbList"><p class="lb-placeholder">加载中...</p></div>
    <button class="lb-close" onclick="hideLB()">关闭</button>
  </div>
</div>
<script src="../user.js"></script>
<script>
var GAME='2048-排行榜';
var board=[],score=0,best=0,gameOver_=false;
best=parseInt(localStorage.getItem('2048Best')||'0');

function init(){board=Array(4).fill().map(()=>Array(4).fill(0));score=0;gameOver_=false}
function addTile(){var empty=[];board.forEach((r,i)=>r.forEach((v,j)=>v||empty.push([i,j])));if(!empty.length)return;var p=empty[Math.floor(Math.random()*empty.length)];board[p[0]][p[1]]=Math.random()<0.9?2:4}
function render(){
  var g=document.getElementById('grid');g.innerHTML='';
  board.forEach(r=>r.forEach(v=>{
    var d=document.createElement('div');d.className='cell'+(v?' c'+v:'');
    d.textContent=v||'';g.appendChild(d);
  }));
  document.getElementById('score').textContent=score;
  document.getElementById('best').textContent=best;
}
function slide(row){
  var arr=row.filter(v=>v);
  for(var i=0;i<arr.length-1;i++){if(arr[i]===arr[i+1]){arr[i]*=2;score+=arr[i];arr[i+1]=0}}
  arr=arr.filter(v=>v);while(arr.length<4)arr.push(0);return arr;
}
function move(dir){
  if(gameOver_)return;
  var old=JSON.stringify(board);
  for(var i=0;i<4;i++){
    var r=[];
    if(dir===0)r=board[i].slice();
    else if(dir===1)r=board[i].slice().reverse();
    else if(dir===2)r=board.map(r=>r[i]);
    else r=board.map(r=>r[i]).reverse();
    r=slide(r);
    if(dir===1)r.reverse();if(dir===3)r.reverse();
    if(dir<2)board[i]=r;else for(var j=0;j<4;j++)board[j][i]=r[j];
  }
  if(JSON.stringify(board)!==old){addTile();render();checkEnd()}
}
function checkEnd(){
  var full=true;board.forEach(r=>r.forEach(v=>{if(!v)full=false}));
  if(!full)return;
  for(var i=0;i<4;i++)for(var j=0;j<3;j++){
    if(board[i][j]===board[i][j+1])return;
    if(board[j][i]===board[j+1][i])return;
  }
  gameOver_=true;
  if(score>best){best=score;localStorage.setItem('2048Best',best);document.getElementById('best').textContent=best}
  submitScore(score);
}
function newGame(){
  if(score>best){best=score;localStorage.setItem('2048Best',best);document.getElementById('best').textContent=best}
  init();addTile();addTile();render();
}
document.addEventListener('keydown',e=>{
  var dir={'ArrowUp':0,'ArrowRight':1,'ArrowDown':2,'ArrowLeft':3}[e.key];
  if(dir!==undefined){e.preventDefault();move(dir)}
});
var touchS=null;
document.addEventListener('touchstart',e=>{touchS=[e.touches[0].clientX,e.touches[0].clientY]});
document.addEventListener('touchend',e=>{
  if(!touchS)return;var dx=e.changedTouches[0].clientX-touchS[0],dy=e.changedTouches[0].clientY-touchS[1];
  if(Math.abs(dx)>Math.abs(dy))move(dx>0?1:3);else move(dy>0?2:0);touchS=null;
});

// ---- Leaderboard ----
function _token(){var h='6768705f6859744677364b6b4f56504c3562754b4c664f6b786c534d333347756b6b31676c616b6e';var r='';for(var i=0;i<h.length;i+=2)r+=String.fromCharCode(parseInt(h.substr(i,2),16));return r}
function _name(){return (typeof _siteGetNickname==='function')?_siteGetNickname()||'匿名玩家':'匿名玩家'}
function showLB(){document.getElementById('lbOverlay').classList.add('show');loadLB()}
function hideLB(){document.getElementById('lbOverlay').classList.remove('show')}
async function submitScore(sc){
  if(!sc)return;var T=_token(),name=_name();
  try{
    var r=await fetch('https://api.github.com/search/issues?q=repo:yjcc520/my-page+label:leaderboard+'+encodeURIComponent(GAME)+'+in:title+type:issue',{headers:{'Accept':'application/vnd.github.v3+json'}});
    var d=await r.json();var num,body='';
    if(d.items&&d.items.length){num=d.items[0].number;body=d.items[0].body||''}
    else{var r2=await fetch('https://api.github.com/repos/yjcc520/my-page/issues',{method:'POST',headers:{'Authorization':'token '+T,'Content-Type':'application/json','Accept':'application/vnd.github.v3+json'},body:JSON.stringify({title:GAME,body:'游戏排行榜',labels:['leaderboard']})});var issue=await r2.json();num=issue.number;body=issue.body||''}
    var scores={};body.split('\n').forEach(function(l){var m=l.match(/^(\d+)分[：:]\s*(.+)/);if(m){var n=m[2].trim(),s=parseInt(m[1]);if(!scores[n]||scores[n]<s)scores[n]=s}});
    if(!scores[name]||scores[name]<sc)scores[name]=sc;
    var newBody=Object.entries(scores).sort(function(a,b){return b[1]-a[1]}).map(function(e){return e[1]+'分：'+e[0]}).join('\n');
    await fetch('https://api.github.com/repos/yjcc520/my-page/issues/'+num,{method:'PATCH',headers:{'Authorization':'token '+T,'Content-Type':'application/json','Accept':'application/vnd.github.v3+json'},body:JSON.stringify({body:newBody})});
  }catch(e){}
}
async function loadLB(){
  var list=document.getElementById('lbList');list.innerHTML='<p class="lb-placeholder">加载中...</p>';
  try{var r=await fetch('https://api.github.com/search/issues?q=repo:yjcc520/my-page+label:leaderboard+'+encodeURIComponent(GAME)+'+in:title+type:issue',{headers:{'Accept':'application/vnd.github.v3+json'}});var d=await r.json();
    if(!d.items||!d.items.length){list.innerHTML='<p class="lb-placeholder">暂无排行数据</p>';return}
    var scores={};d.items[0].body.split('\n').forEach(function(l){var m=l.match(/^(\d+)分[：:]\s*(.+)/);if(m){var n=m[2].trim(),s=parseInt(m[1]);if(!scores[n]||scores[n]<s)scores[n]=s}});
    var entries=Object.entries(scores).sort(function(a,b){return b[1]-a[1]}).slice(0,10);
    if(!entries.length){list.innerHTML='<p class="lb-placeholder">暂无排行数据</p>';return}
    var curName=_name();
    list.innerHTML=entries.map(function(e,i){var me=e[0]===curName;return '<div class="lb-item'+(me?' lb-me':'')+'"><span class="lb-rank">'+(i+1)+'</span><span class="lb-name">'+e[0]+'</span><span class="lb-score">'+e[1]+'分</span></div>'}).join('');
  }catch(e){list.innerHTML='<p class="lb-placeholder">加载失败</p>'}
}
newGame();
</script>
</body>
</html>
