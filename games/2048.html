<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2048 | 蔡梓涵</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#faf8ef;display:flex;justify-content:center;align-items:center;height:100vh}
.container{text-align:center;width:90%;max-width:420px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:0.5rem}
h1{font-size:2.5rem;color:#776e65;margin:0}
.scores{display:flex;gap:0.5rem}
.score-box{background:#bbada0;color:#fff;padding:0.3rem 1rem;border-radius:6px;text-align:center}
.score-box .label{font-size:0.65rem;text-transform:uppercase;opacity:0.8}
.score-box .val{font-size:1.3rem;font-weight:700}
.sub{color:#776e65;margin-bottom:0.8rem;font-size:0.9rem}
.grid{position:relative;width:100%;aspect-ratio:1;background:#bbada0;border-radius:8px;padding:7px;display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.cell{background:rgba(238,228,218,0.35);border-radius:5px;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.4rem;transition:all 0.1s}
.c2{background:#eee4da;color:#776e65}.c4{background:#ede0c8;color:#776e65}
.c8{background:#f2b179;color:#f9f6f2}.c16{background:#f59563;color:#f9f6f2}
.c32{background:#f67c5f;color:#f9f6f2}.c64{background:#f65e3b;color:#f9f6f2}
.c128{background:#edcf72;color:#f9f6f2;font-size:1.2rem}.c256{background:#edcc61;color:#f9f6f2;font-size:1.2rem}
.c512{background:#edc850;color:#f9f6f2;font-size:1.2rem}.c1024{background:#edc53f;color:#f9f6f2;font-size:1rem}
.c2048{background:#edc22e;color:#f9f6f2;font-size:1rem}.c4096{background:#3c3a32;color:#f9f6f2;font-size:0.9rem}
.btn{background:#8f7a66;color:#f9f6f2;border:none;padding:0.6rem 1.2rem;border-radius:6px;font-size:0.9rem;font-weight:600;cursor:pointer;margin-top:1rem;transition:opacity 0.2s}
.btn:hover{opacity:0.85}
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(255,255,255,0.7);display:none;justify-content:center;align-items:center;z-index:10}
.overlay.show{display:flex}
.overlay-box{background:#fff;padding:2rem;border-radius:12px;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,0.15)}
.overlay-box h2{font-size:1.5rem;color:#776e65}
.overlay-box p{color:#999;margin:0.5rem 0}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>2048</h1>
    <div class="scores">
      <div class="score-box"><div class="label">分数</div><div class="val" id="score">0</div></div>
      <div class="score-box"><div class="label">最高</div><div class="val" id="best">0</div></div>
    </div>
  </div>
  <p class="sub">方向键或滑动合并数字，拼出 2048</p>
  <div class="grid" id="grid"></div>
  <button class="btn" onclick="newGame()">新游戏</button>
</div>
<div class="overlay" id="overlay">
  <div class="overlay-box">
    <h2 id="winMsg">恭喜！</h2>
    <p id="winScore"></p>
    <button class="btn" onclick="hideOverlay()">继续</button>
  </div>
</div>
<script>
var board=[],score=0,best=0;
best=parseInt(localStorage.getItem('2048Best')||'0');

function init(){board=Array(4).fill().map(()=>Array(4).fill(0));score=0}
function addTile(){var empty=[];board.forEach((r,i)=>r.forEach((v,j)=>v||empty.push([i,j])));if(!empty.length)return;var p=empty[Math.floor(Math.random()*empty.length)];board[p[0]][p[1]]=Math.random()<0.9?2:4}
function render(){
  var g=document.getElementById('grid');g.innerHTML='';
  board.forEach(r=>r.forEach(v=>{
    var d=document.createElement('div');d.className='cell'+(v?' c'+v:'');
    d.textContent=v||'';g.appendChild(d);
  }));
  document.getElementById('score').textContent=score;
  document.getElementById('best').textContent=best;
}
function slide(row){
  var arr=row.filter(v=>v);
  for(var i=0;i<arr.length-1;i++){if(arr[i]===arr[i+1]){arr[i]*=2;score+=arr[i];arr[i+1]=0}}
  arr=arr.filter(v=>v);while(arr.length<4)arr.push(0);return arr;
}
function move(dir){
  var old=JSON.stringify(board);
  for(var i=0;i<4;i++){
    var r=[];
    if(dir===0)r=board[i].slice();
    else if(dir===1)r=board[i].slice().reverse();
    else if(dir===2)r=board.map(r=>r[i]);
    else r=board.map(r=>r[i]).reverse();
    r=slide(r);
    if(dir===1)r.reverse();if(dir===3)r.reverse();
    if(dir<2)board[i]=r;else for(var j=0;j<4;j++)board[j][i]=r[j];
  }
  if(JSON.stringify(board)!==old){addTile();render();checkWin()}
}
function checkWin(){
  board.forEach(r=>r.forEach(v=>{if(v>=2048){document.getElementById('winMsg').textContent='2048！';document.getElementById('winScore').textContent='得分: '+score;document.getElementById('overlay').classList.add('show')}}));
}
function hideOverlay(){document.getElementById('overlay').classList.remove('show')}
function newGame(){init();addTile();addTile();render();hideOverlay();if(score>best){best=score;localStorage.setItem('2048Best',best);document.getElementById('best').textContent=best}}
document.addEventListener('keydown',e=>{
  var dir={'ArrowUp':0,'ArrowRight':1,'ArrowDown':2,'ArrowLeft':3}[e.key];
  if(dir!==undefined){e.preventDefault();move(dir)}
});
var touchS=null;
document.addEventListener('touchstart',e=>{touchS=[e.touches[0].clientX,e.touches[0].clientY]});
document.addEventListener('touchend',e=>{
  if(!touchS)return;var dx=e.changedTouches[0].clientX-touchS[0],dy=e.changedTouches[0].clientY-touchS[1];
  if(Math.abs(dx)>Math.abs(dy))move(dx>0?1:3);else move(dy>0?2:0);touchS=null;
});
newGame();
</script>
</body>
</html>
