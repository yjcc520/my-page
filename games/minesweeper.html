<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>扫雷 | 蔡梓涵</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="apple-touch-icon" href="/favicon.svg">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#1a1a2e;color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh;user-select:none}
.container{text-align:center;width:90%;max-width:420px}
h1{font-size:2rem;margin-bottom:0.3rem}
.sub{color:#8ab4f8;margin-bottom:1rem;font-size:0.9rem}
.info{display:flex;justify-content:space-between;align-items:center;margin-bottom:0.8rem;font-size:0.95rem}
.info .mines{color:#ef4444;font-weight:700}
.board{display:grid;gap:2px;justify-content:center}
.cell{width:32px;height:32px;background:#3b3b6b;border-radius:3px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.85rem;cursor:pointer;transition:background 0.1s}
.cell:hover{background:#4b4b8b}
.cell.revealed{background:#2a2a4a;cursor:default}
.cell.flag{background:#3b3b6b}
.cell.mine{background:#ef4444}
.c1{color:#4ade80}.c2{color:#60a5fa}.c3{color:#f472b6}.c4{color:#a78bfa}
.c5{color:#f87171}.c6{color:#38bdf8}.c7{color:#fbbf24}.c8{color:#fb923c}
.btn-row{display:flex;gap:0.5rem;justify-content:center;margin-top:1rem}
.btn{background:#8ab4f8;color:#1a1a2e;border:none;padding:0.5rem 1.2rem;border-radius:6px;font-size:0.9rem;font-weight:600;cursor:pointer}
.msg{font-size:1.1rem;margin-top:0.8rem;min-height:1.5rem;color:#8ab4f8}
/* LB */
.lb-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);display:none;justify-content:center;align-items:center;z-index:100}
.lb-overlay.show{display:flex}
.lb-panel{background:#1a1a2e;border:1px solid rgba(138,180,248,0.3);border-radius:12px;width:90%;max-width:380px;max-height:80vh;overflow-y:auto;padding:1.5rem}
.lb-panel h3{text-align:center;color:#8ab4f8;margin-bottom:1rem}
.lb-item{display:flex;align-items:center;padding:0.5rem 0.8rem;border-bottom:1px solid rgba(255,255,255,0.06);font-size:0.9rem}
.lb-item:last-child{border-bottom:none}
.lb-rank{width:30px;color:#8ab4f8;font-weight:700;flex-shrink:0}
.lb-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-score{color:#4ade80;font-weight:700;flex-shrink:0}
.lb-placeholder{text-align:center;color:#667;padding:1.5rem 0}
.lb-me{background:rgba(138,180,248,0.08);border-radius:6px}
.lb-close{display:block;margin:1rem auto 0;background:#3b3b6b;color:#ccc;border:none;padding:0.5rem 2rem;border-radius:6px;cursor:pointer}
</style>
</head>
<body>
<div class="container">
  <h1>扫雷</h1>
  <p class="sub">点击翻开，右键/长按插旗</p>
  <div class="info">💣 剩余: <span class="mines" id="minesLeft">10</span> | ⏱ <span id="timer">0</span>s</div>
  <div class="board" id="board"></div>
  <div class="msg" id="msg"></div>
  <div class="btn-row">
    <button class="btn" onclick="start()">新游戏</button>
    <button class="btn" onclick="showLB()">🏆 排行</button>
  </div>
</div>
<div class="lb-overlay" id="lbOverlay">
  <div class="lb-panel">
    <h3>扫雷 — 排行榜</h3>
    <div id="lbList"><p class="lb-placeholder">加载中...</p></div>
    <button class="lb-close" onclick="hideLB()">关闭</button>
  </div>
</div>
    <script src="../user.js"></script>
<script>
var GAME='扫雷-排行榜';
var rows=10,cols=8,mines=10,board=[],revealed=[],flagged=[],gameOver_=false,timerId=null,seconds=0;
function start(){
  board=Array(rows).fill().map(()=>Array(cols).fill(0));
  revealed=Array(rows).fill().map(()=>Array(cols).fill(false));
  flagged=Array(rows).fill().map(()=>Array(cols).fill(false));
  gameOver_=false;seconds=0;clearInterval(timerId);timerId=null;
  document.getElementById('msg').textContent='';
  document.getElementById('timer').textContent='0';
  var placed=0;while(placed<mines){var r=Math.floor(Math.random()*rows),c=Math.floor(Math.random()*cols);if(!board[r][c]){board[r][c]=-1;placed++}}
  for(var r=0;r<rows;r++)for(var c=0;c<cols;c++){if(board[r][c]===-1)continue;var n=0;for(var dr=-1;dr<=1;dr++)for(var dc=-1;dc<=1;dc++){var nr=r+dr,nc=c+dc;if(nr>=0&&nr<rows&&nc>=0&&nc<cols&&board[nr][nc]===-1)n++}board[r][c]=n}
  updateMines();render();
}
function updateMines(){var f=flagged.flat().filter(Boolean).length;document.getElementById('minesLeft').textContent=mines-f}
function render(){
  var b=document.getElementById('board');b.style.gridTemplateColumns='repeat('+cols+',32px)';b.innerHTML='';
  for(var r=0;r<rows;r++)for(var c=0;c<cols;c++){
    var d=document.createElement('div');d.className='cell';
    if(revealed[r][c]){d.classList.add('revealed');if(board[r][c]===-1){d.classList.add('mine');d.textContent='💣'}else if(board[r][c]>0){d.classList.add('c'+board[r][c]);d.textContent=board[r][c]}}
    else if(flagged[r][c]){d.classList.add('flag');d.textContent='🚩'}
    d.onclick=(e)=>click(r,c);
    d.oncontextmenu=(e)=>{e.preventDefault();flag(r,c)};
    b.appendChild(d);
  }
}
function click(r,c){
  if(gameOver_||revealed[r][c]||flagged[r][c])return;
  if(!timerId)timerId=setInterval(()=>{seconds++;document.getElementById('timer').textContent=seconds},1000);
  if(board[r][c]===-1){revealed[r][c]=true;render();gameOver_=true;clearInterval(timerId);document.getElementById('msg').textContent='💥 踩雷了！';revealAll();return}
  flood(r,c);render();checkWin();
}
function flood(r,c){
  if(r<0||r>=rows||c<0||c>=cols||revealed[r][c]||flagged[r][c]||board[r][c]===-1)return;
  revealed[r][c]=true;if(board[r][c]===0)for(var dr=-1;dr<=1;dr++)for(var dc=-1;dc<=1;dc++)flood(r+dr,c+dc);
}
function flag(r,c){if(gameOver_||revealed[r][c])return;flagged[r][c]=!flagged[r][c];updateMines();render()}
function revealAll(){for(var r=0;r<rows;r++)for(var c=0;c<cols;c++)if(board[r][c]===-1)revealed[r][c]=true;render()}
function checkWin(){
  var allRevealed=true;
  for(var r=0;r<rows;r++)for(var c=0;c<cols;c++)if(board[r][c]!==-1&&!revealed[r][c])allRevealed=false;
  if(allRevealed){gameOver_=true;clearInterval(timerId);document.getElementById('msg').textContent='🎉 赢了！用时 '+seconds+' 秒';submitScore(seconds)}
}
// Leaderboard
function _name(){return (typeof _siteGetNickname==='function')?_siteGetNickname()||'匿名玩家':'匿名玩家'}
function showLB(){document.getElementById('lbOverlay').classList.add('show');loadLB()}
function hideLB(){document.getElementById('lbOverlay').classList.remove('show')}
async function loadLB(){
  var list=document.getElementById('lbList');list.innerHTML='<p class="lb-placeholder">加载中...</p>';
  try{var r=await fetch('https://api.github.com/search/issues?q=repo:yjcc520/my-page+label:leaderboard+'+encodeURIComponent(GAME)+'+in:title+type:issue',{headers:{'Accept':'application/vnd.github.v3+json'}});var d=await r.json();
    if(!d.items||!d.items.length){list.innerHTML='<p class="lb-placeholder">暂无排行数据</p>';return}
    var scores={};d.items[0].body.split('\n').forEach(function(l){var m=l.match(/^(\d+)秒[：:]\s*(.+)/);if(m){var n=m[2].trim(),s=parseInt(m[1]);if(!scores[n]||scores[n]>s)scores[n]=s}});
    var entries=Object.entries(scores).sort(function(a,b){return a[1]-b[1]}).slice(0,10);
    if(!entries.length){list.innerHTML='<p class="lb-placeholder">暂无排行数据</p>';return}
    var curName=_name();
    list.innerHTML=entries.map(function(e,i){var me=e[0]===curName;return '<div class="lb-item'+(me?' lb-me':'')+'"><span class="lb-rank">'+(i+1)+'</span><span class="lb-name">'+e[0]+'</span><span class="lb-score">'+e[1]+'秒</span></div>'}).join('');
  }catch(e){list.innerHTML='<p class="lb-placeholder">加载失败</p>'}
}
start();
</script>
<script>
/* 排行榜改造：写入 GitHub 需要前端持有凭据（存在泄露风险），已停用。
   成绩改为记录在本机；线上榜单保留为历史数据展示。 */
(function () {
  var G = (typeof GAME !== 'undefined' && GAME) ||
          (typeof GAME_SNAKE !== 'undefined' && GAME_SNAKE) ||
          (typeof GAME_SHOOT !== 'undefined' && GAME_SHOOT) || 'game';

  function toast(msg) {
    var d = document.createElement('div');
    d.textContent = msg;
    d.style.cssText = 'position:fixed;left:50%;bottom:32px;transform:translateX(-50%);' +
      'background:rgba(30,41,59,0.92);color:#fff;padding:0.55rem 1.1rem;border-radius:10px;' +
      'font-size:0.85rem;z-index:9999;pointer-events:none;transition:opacity .4s;font-family:inherit';
    document.body.appendChild(d);
    setTimeout(function () { d.style.opacity = '0'; }, 1800);
    setTimeout(function () { if (d.parentNode) d.parentNode.removeChild(d); }, 2400);
  }

  window.submitScore = function (sc) {
    if (!sc) return;
    try { localStorage.setItem('lb_local_' + G, sc); } catch (e) {}
    toast('本机成绩已记录：' + sc + ' · 公网榜暂停提交');
  };

  var _orig = window.loadLB;
  if (typeof _orig === 'function') {
    window.loadLB = async function () {
      await _orig.apply(this, arguments);
      var l = document.getElementById('lbList');
      if (l && !l.querySelector('.lb-frozen')) {
        l.insertAdjacentHTML('afterbegin',
          '<p class="lb-frozen" style="font-size:0.75rem;color:#889;text-align:center;margin-bottom:0.6rem">' +
          '历史榜单 · 公网提交已暂停</p>');
      }
    };
  }
})();
</script>
</body>
</html>
