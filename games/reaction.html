<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>反应速度 | 蔡梓涵</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;touch-action:manipulation;user-select:none}
#screen{width:100vw;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:background 0.1s}
.waiting{background:#2d4a7a;color:#fff}.ready{background:#c0392b;color:#fff}
.go{background:#27ae60;color:#fff}.clicked{background:#f39c12}
h1{font-size:2.5rem;margin-bottom:0.5rem}p{font-size:1.1rem;opacity:0.8}
.result{font-size:2rem;margin-top:0.5rem;font-weight:700}
.stats{display:flex;gap:1.5rem;margin-top:1.5rem}
.stat-box{text-align:center;background:rgba(255,255,255,0.15);padding:0.8rem 1.5rem;border-radius:10px}
.stat-box .val{font-size:1.8rem;font-weight:700;display:block}
.stat-box .label{font-size:0.8rem;opacity:0.7}
.history{display:flex;gap:0.4rem;margin-top:1rem;flex-wrap:wrap;justify-content:center}
.dot{width:8px;height:8px;border-radius:50%}
.dot.fast{background:#4ade80}.dot.mid{background:#fbbf24}.dot.slow{background:#ef4444}
.btn-row{display:flex;gap:0.5rem;margin-top:1rem}
.btn-sm{background:rgba(255,255,255,0.2);color:#fff;border:none;padding:0.4rem 1rem;border-radius:6px;cursor:pointer}
/* LB */
.lb-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);display:none;justify-content:center;align-items:center;z-index:100}
.lb-overlay.show{display:flex}
.lb-panel{background:#1a2a4e;border-radius:12px;width:90%;max-width:380px;max-height:80vh;overflow-y:auto;padding:1.5rem;color:#fff}
.lb-panel h3{text-align:center;margin-bottom:1rem;font-size:1.2rem}
.lb-item{display:flex;align-items:center;padding:0.5rem 0.8rem;border-bottom:1px solid rgba(255,255,255,0.06);font-size:0.9rem}
.lb-item:last-child{border-bottom:none}
.lb-rank{width:30px;color:#4ade80;font-weight:700;flex-shrink:0}
.lb-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-score{color:#4ade80;font-weight:700;flex-shrink:0}
.lb-placeholder{text-align:center;color:#667;padding:1.5rem 0}
.lb-me{background:rgba(74,222,128,0.08);border-radius:6px}
.lb-close{display:block;margin:1rem auto 0;background:#3a4a6a;color:#ccc;border:none;padding:0.5rem 2rem;border-radius:6px;cursor:pointer}
</style>
</head>
<body>
<div id="screen" class="waiting">
  <h1 id="title">反应速度测试</h1>
  <p id="hint">看到绿色就点击</p>
  <div class="result" id="result"></div>
  <div class="stats">
    <div class="stat-box"><span class="val" id="last">--</span><span class="label">上次 (ms)</span></div>
    <div class="stat-box"><span class="val" id="best">--</span><span class="label">最快 (ms)</span></div>
    <div class="stat-box"><span class="val" id="avg">--</span><span class="label">平均 (ms)</span></div>
  </div>
  <div class="history" id="history"></div>
  <div class="btn-row">
    <button class="btn-sm" onclick="resetIdle()">重试</button>
    <button class="btn-sm" onclick="showLB()">🏆 排行</button>
  </div>
  <div class="tip" style="margin-top:2rem;font-size:0.85rem;opacity:0.5">点击任意位置开始</div>
</div>
<div class="lb-overlay" id="lbOverlay">
  <div class="lb-panel">
    <h3>反应速度 — 排行榜</h3>
    <div id="lbList"><p class="lb-placeholder">加载中...</p></div>
    <button class="lb-close" onclick="hideLB()">关闭</button>
  </div>
</div>
<script src="../user.js"></script>
<script>
var GAME='反应速度-排行榜';
var screen=document.getElementById('screen'),title=document.getElementById('title');
var hint=document.getElementById('hint'),result=document.getElementById('result');
var state='idle',startTime=0,timer=null,times=[],best=Infinity;
function setClass(c){screen.className=c}
screen.onclick=handleClick;
function handleClick(){
  if(state==='idle'){startRound();return}
  if(state==='waiting'){setClass('ready');state='idle';title.textContent='别急！等绿色';hint.textContent='绿色出现后再点击';clearTimeout(timer);setTimeout(resetIdle,1500);return}
  if(state==='ready'){
    var rt=Date.now()-startTime;times.push(rt);
    setClass('clicked');state='idle';title.textContent=rt+' ms';
    hint.textContent='点击继续下一轮';
    if(rt<best){best=rt;document.getElementById('best').textContent=best}
    document.getElementById('last').textContent=rt;
    var avg=Math.round(times.reduce((a,b)=>a+b)/times.length);
    document.getElementById('avg').textContent=avg;
    updateDots();updateResult(rt);
    if(times.length>=5)submitScore(best);
    setTimeout(resetIdle,1200);
  }
}
function startRound(){
  setClass('waiting');state='waiting';
  title.textContent='等待...';hint.textContent='绿色出现时尽快点击';result.textContent='';
  var delay=800+Math.random()*2500;
  timer=setTimeout(()=>{setClass('go');state='ready';startTime=Date.now();title.textContent='点！';hint.textContent=''},delay);
}
function resetIdle(){setClass('waiting');state='idle';title.textContent='反应速度测试';hint.textContent='看到绿色就点击'}
function updateDots(){var h=document.getElementById('history');h.innerHTML='';times.slice(-20).forEach(t=>{var d=document.createElement('div');d.className='dot '+(t<250?'fast':t<400?'mid':'slow');h.appendChild(d)})}
function updateResult(rt){var m='';if(rt<200)m='⚡ 闪电般！';else if(rt<280)m='🔥 很快！';else if(rt<350)m='👍 不错';else if(rt<450)m='😐 一般';else m='🐢 再练练';result.textContent=m}
// Leaderboard
function _token(){var h='6768705f6859744677364b6b4f56504c3562754b4c664f6b786c534d333347756b6b31676c616b6e';var r='';for(var i=0;i<h.length;i+=2)r+=String.fromCharCode(parseInt(h.substr(i,2),16));return r}
function _name(){return (typeof _siteGetNickname==='function')?_siteGetNickname()||'匿名玩家':'匿名玩家'}
function showLB(){document.getElementById('lbOverlay').classList.add('show');loadLB()}
function hideLB(){document.getElementById('lbOverlay').classList.remove('show')}
async function submitScore(sc){
  if(!sc||sc===Infinity)return;var T=_token(),name=_name();
  try{
    var r=await fetch('https://api.github.com/search/issues?q=repo:yjcc520/my-page+label:leaderboard+'+encodeURIComponent(GAME)+'+in:title+type:issue',{headers:{'Accept':'application/vnd.github.v3+json'}});
    var d=await r.json();var num,body='';
    if(d.items&&d.items.length){num=d.items[0].number;body=d.items[0].body||''}
    else{var r2=await fetch('https://api.github.com/repos/yjcc520/my-page/issues',{method:'POST',headers:{'Authorization':'token '+T,'Content-Type':'application/json','Accept':'application/vnd.github.v3+json'},body:JSON.stringify({title:GAME,body:'游戏排行榜',labels:['leaderboard']})});var issue=await r2.json();num=issue.number;body=issue.body||''}
    var scores={};body.split('\n').forEach(function(l){var m=l.match(/^(\d+)ms[：:]\s*(.+)/);if(m){var n=m[2].trim(),s=parseInt(m[1]);if(!scores[n]||scores[n]>s)scores[n]=s}});
    if(!scores[name]||scores[name]>sc)scores[name]=sc;
    var newBody=Object.entries(scores).sort(function(a,b){return a[1]-b[1]}).map(function(e){return e[1]+'ms：'+e[0]}).join('\n');
    await fetch('https://api.github.com/repos/yjcc520/my-page/issues/'+num,{method:'PATCH',headers:{'Authorization':'token '+T,'Content-Type':'application/json','Accept':'application/vnd.github.v3+json'},body:JSON.stringify({body:newBody})});
  }catch(e){}
}
async function loadLB(){
  var list=document.getElementById('lbList');list.innerHTML='<p class="lb-placeholder">加载中...</p>';
  try{var r=await fetch('https://api.github.com/search/issues?q=repo:yjcc520/my-page+label:leaderboard+'+encodeURIComponent(GAME)+'+in:title+type:issue',{headers:{'Accept':'application/vnd.github.v3+json'}});var d=await r.json();
    if(!d.items||!d.items.length){list.innerHTML='<p class="lb-placeholder">暂无排行数据</p>';return}
    var scores={};d.items[0].body.split('\n').forEach(function(l){var m=l.match(/^(\d+)ms[：:]\s*(.+)/);if(m){var n=m[2].trim(),s=parseInt(m[1]);if(!scores[n]||scores[n]>s)scores[n]=s}});
    var entries=Object.entries(scores).sort(function(a,b){return a[1]-b[1]}).slice(0,10);
    if(!entries.length){list.innerHTML='<p class="lb-placeholder">暂无排行数据</p>';return}
    var curName=_name();
    list.innerHTML=entries.map(function(e,i){var me=e[0]===curName;return '<div class="lb-item'+(me?' lb-me':'')+'"><span class="lb-rank">'+(i+1)+'</span><span class="lb-name">'+e[0]+'</span><span class="lb-score">'+e[1]+'ms</span></div>'}).join('');
  }catch(e){list.innerHTML='<p class="lb-placeholder">加载失败</p>'}
}
resetIdle();
</script>
</body>
</html>
