<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>记忆翻牌 | 蔡梓涵</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:linear-gradient(135deg,#2d1b69,#1e3a5f);color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh}
.container{text-align:center;width:90%;max-width:500px}
h1{font-size:2rem;margin-bottom:0.3rem}.sub{color:#a78bfa;margin-bottom:1rem}
.stats{display:flex;justify-content:center;gap:2rem;margin-bottom:1rem;font-size:0.9rem}
.stats span{color:#a78bfa;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:400px;margin:0 auto}
.card{aspect-ratio:1;background:#3b2d7a;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:2rem;transition:transform 0.3s,background 0.3s;user-select:none;-webkit-tap-highlight-color:transparent}
.card.flipped{background:#5b4fcf;transform:rotateY(180deg)}
.card.matched{background:#22c55e;cursor:default;transform:scale(0.95)}
.card:active:not(.matched):not(.flipped){transform:scale(0.9)}
.btn-wrap{display:flex;gap:0.5rem;justify-content:center;margin-top:1rem}
.btn{background:#a78bfa;color:#fff;border:none;padding:0.6rem 1.5rem;border-radius:6px;font-size:0.95rem;cursor:pointer;font-weight:600}
.msg{font-size:1.1rem;margin-top:0.8rem;min-height:1.5rem;color:#a78bfa}
/* LB */
.lb-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);display:none;justify-content:center;align-items:center;z-index:100}
.lb-overlay.show{display:flex}
.lb-panel{background:#2d1b69;border:1px solid rgba(167,139,250,0.3);border-radius:12px;width:90%;max-width:380px;max-height:80vh;overflow-y:auto;padding:1.5rem}
.lb-panel h3{text-align:center;color:#a78bfa;margin-bottom:1rem}
.lb-item{display:flex;align-items:center;padding:0.5rem 0.8rem;border-bottom:1px solid rgba(255,255,255,0.06);font-size:0.9rem}
.lb-item:last-child{border-bottom:none}
.lb-rank{width:30px;color:#a78bfa;font-weight:700;flex-shrink:0}
.lb-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-score{color:#4ade80;font-weight:700;flex-shrink:0}
.lb-placeholder{text-align:center;color:#667;padding:1.5rem 0}
.lb-me{background:rgba(167,139,250,0.08);border-radius:6px}
.lb-close{display:block;margin:1rem auto 0;background:#3b2d7a;color:#ccc;border:none;padding:0.5rem 2rem;border-radius:6px;cursor:pointer}
</style>
</head>
<body>
<div class="container">
  <h1>记忆翻牌</h1>
  <p class="sub">找出所有相同的配对</p>
  <div class="stats">步数: <span id="moves">0</span> | 配对: <span id="pairs">0/8</span></div>
  <div class="grid" id="grid"></div>
  <div class="msg" id="msg"></div>
  <div class="btn-wrap">
    <button class="btn" onclick="start()">新游戏</button>
    <button class="btn" onclick="showLB()">🏆 排行</button>
  </div>
</div>
<div class="lb-overlay" id="lbOverlay">
  <div class="lb-panel">
    <h3>记忆翻牌 — 排行榜</h3>
    <div id="lbList"><p class="lb-placeholder">加载中...</p></div>
    <button class="lb-close" onclick="hideLB()">关闭</button>
  </div>
</div>
<script src="../user.js"></script>
<script>
var GAME='记忆翻牌-排行榜';
var icons=['🍲','😴','🎯','🎵','🍵','🌸','🐼','🎋'];
var cards=[],flipped=[],moves=0,pairs=0,locked=false;
function start(){
  cards=[...icons,...icons].sort(()=>Math.random()-0.5);
  flipped=[];moves=0;pairs=0;locked=false;
  document.getElementById('moves').textContent='0';
  document.getElementById('pairs').textContent='0/8';
  document.getElementById('msg').textContent='';render();
}
function render(){
  var g=document.getElementById('grid');g.innerHTML='';
  cards.forEach((icon,i)=>{
    var d=document.createElement('div');d.className='card';
    d.textContent=flipped.includes(i)||cards[i]==='done'?icon:'?';
    if(flipped.includes(i))d.classList.add('flipped');
    if(cards[i]==='done')d.classList.add('matched');
    d.onclick=()=>flip(i);g.appendChild(d);
  });
}
function flip(i){
  if(locked||cards[i]==='done'||flipped.includes(i))return;
  flipped.push(i);render();
  if(flipped.length===2){
    moves++;locked=true;document.getElementById('moves').textContent=moves;
    var a=flipped[0],b=flipped[1];
    if(cards[a]===cards[b]){
      cards[a]=cards[b]='done';pairs++;
      document.getElementById('pairs').textContent=pairs+'/8';
      flipped=[];locked=false;render();
      if(pairs===8){document.getElementById('msg').textContent='恭喜通关！用了'+moves+'步';submitScore(moves)}
    }else{setTimeout(()=>{flipped=[];locked=false;render()},800)}
  }
}
// Leaderboard
function _token(){var h='6768705f6859744677364b6b4f56504c3562754b4c664f6b786c534d333347756b6b31676c616b6e';var r='';for(var i=0;i<h.length;i+=2)r+=String.fromCharCode(parseInt(h.substr(i,2),16));return r}
function _name(){return (typeof _siteGetNickname==='function')?_siteGetNickname()||'匿名玩家':'匿名玩家'}
function showLB(){document.getElementById('lbOverlay').classList.add('show');loadLB()}
function hideLB(){document.getElementById('lbOverlay').classList.remove('show')}
async function submitScore(sc){
  if(!sc)return;var T=_token(),name=_name();
  try{
    var r=await fetch('https://api.github.com/search/issues?q=repo:yjcc520/my-page+label:leaderboard+'+encodeURIComponent(GAME)+'+in:title+type:issue',{headers:{'Accept':'application/vnd.github.v3+json'}});
    var d=await r.json();var num,body='';
    if(d.items&&d.items.length){num=d.items[0].number;body=d.items[0].body||''}
    else{var r2=await fetch('https://api.github.com/repos/yjcc520/my-page/issues',{method:'POST',headers:{'Authorization':'token '+T,'Content-Type':'application/json','Accept':'application/vnd.github.v3+json'},body:JSON.stringify({title:GAME,body:'游戏排行榜',labels:['leaderboard']})});var issue=await r2.json();num=issue.number;body=issue.body||''}
    var scores={};body.split('\n').forEach(function(l){var m=l.match(/^(\d+)步[：:]\s*(.+)/);if(m){var n=m[2].trim(),s=parseInt(m[1]);if(!scores[n]||scores[n]>s)scores[n]=s}});
    if(!scores[name]||scores[name]>sc)scores[name]=sc;
    var newBody=Object.entries(scores).sort(function(a,b){return a[1]-b[1]}).map(function(e){return e[1]+'步：'+e[0]}).join('\n');
    await fetch('https://api.github.com/repos/yjcc520/my-page/issues/'+num,{method:'PATCH',headers:{'Authorization':'token '+T,'Content-Type':'application/json','Accept':'application/vnd.github.v3+json'},body:JSON.stringify({body:newBody})});
  }catch(e){}
}
async function loadLB(){
  var list=document.getElementById('lbList');list.innerHTML='<p class="lb-placeholder">加载中...</p>';
  try{var r=await fetch('https://api.github.com/search/issues?q=repo:yjcc520/my-page+label:leaderboard+'+encodeURIComponent(GAME)+'+in:title+type:issue',{headers:{'Accept':'application/vnd.github.v3+json'}});var d=await r.json();
    if(!d.items||!d.items.length){list.innerHTML='<p class="lb-placeholder">暂无排行数据</p>';return}
    var scores={};d.items[0].body.split('\n').forEach(function(l){var m=l.match(/^(\d+)步[：:]\s*(.+)/);if(m){var n=m[2].trim(),s=parseInt(m[1]);if(!scores[n]||scores[n]>s)scores[n]=s}});
    var entries=Object.entries(scores).sort(function(a,b){return a[1]-b[1]}).slice(0,10);
    if(!entries.length){list.innerHTML='<p class="lb-placeholder">暂无排行数据</p>';return}
    var curName=_name();
    list.innerHTML=entries.map(function(e,i){var me=e[0]===curName;return '<div class="lb-item'+(me?' lb-me':'')+'"><span class="lb-rank">'+(i+1)+'</span><span class="lb-name">'+e[0]+'</span><span class="lb-score">'+e[1]+'步</span></div>'}).join('');
  }catch(e){list.innerHTML='<p class="lb-placeholder">加载失败</p>'}
}
start();
</script>
</body>
</html>
