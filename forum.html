<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>论坛 | 蔡梓涵</title>
<link rel="stylesheet" href="styles.css">
<style>
.forum-page { padding: 5rem 1.5rem 3rem; max-width: 860px; margin: 0 auto; min-height: 80vh; }

/* Header */
.forum-head { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0.8rem; margin-bottom: 1rem; }
.forum-head h1 { font-size: 1.8rem; font-weight: 800; color: var(--text); background: none !important; -webkit-text-fill-color: var(--text) !important; -webkit-background-clip: unset !important; background-clip: unset !important; }
.forum-head-actions { display: flex; gap: 0.5rem; align-items: center; }

/* Stats bar */
.forum-stats { display: flex; gap: 1.2rem; margin-bottom: 1.2rem; font-size: 0.82rem; color: var(--text-light); flex-wrap: wrap; }
.forum-stats span { display: flex; align-items: center; gap: 0.25rem; }

/* Search + Sort row */
.forum-toolbar { display: flex; gap: 0.6rem; align-items: center; margin-bottom: 0.8rem; flex-wrap: wrap; }
.forum-search { padding: 0.5rem 0.8rem; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 0.88rem; font-family: inherit; background: var(--bg); color: var(--text); flex: 1; min-width: 160px; max-width: 320px; transition: border-color 0.2s; }
.forum-search:focus { outline: none; border-color: var(--primary); }
.sort-btn { padding: 0.4rem 0.9rem; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg); color: var(--text-light); cursor: pointer; font-family: inherit; font-size: 0.82rem; white-space: nowrap; transition: all 0.15s; }
.sort-btn:hover { border-color: var(--primary); color: var(--primary); }
.sort-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
.forum-post-btn { padding: 0.45rem 1.2rem; background: linear-gradient(135deg, var(--primary), #7c3aed); color: #fff; border: none; border-radius: var(--radius-sm); cursor: pointer; font-family: inherit; font-weight: 600; font-size: 0.88rem; box-shadow: 0 4px 14px rgba(79,70,229,0.3); white-space: nowrap; }
.forum-post-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(79,70,229,0.4); }

/* Tabs - pill style */
.forum-tabs { display: flex; gap: 0.4rem; margin-bottom: 1.5rem; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 2px; }
.tab-btn { padding: 0.45rem 0.9rem; border: 1px solid var(--border); border-radius: 20px; background: var(--bg); cursor: pointer; font-family: inherit; font-size: 0.84rem; font-weight: 500; color: var(--text-light); white-space: nowrap; transition: all 0.15s; }
.tab-btn:hover { border-color: var(--primary); color: var(--primary); }
.tab-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); font-weight: 600; }

/* Pinned section */
.pinned-section { margin-bottom: 1.2rem; }
.pinned-label { font-size: 0.75rem; color: var(--text-light); font-weight: 600; letter-spacing: 0.08em; margin-bottom: 0.5rem; padding-left: 0.3rem; display: flex; align-items: center; gap: 0.3rem; }

/* Post cards */
.post-list { display: flex; flex-direction: column; gap: 0.6rem; }
.post-card {
  background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 1rem 1.2rem; box-shadow: var(--shadow-sm); transition: transform 0.2s, box-shadow 0.2s;
  cursor: pointer; display: flex; gap: 0.8rem;
}
.post-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
.post-card.pinned { border-left: 3px solid #f59e0b; background: rgba(245,158,11,0.03); }

/* Avatar */
.post-avatar {
  width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, var(--primary), #7c3aed);
  color: #fff; font-weight: 700; font-size: 0.85rem; margin-top: 2px;
}
.post-body { flex: 1; min-width: 0; }
.post-top { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.25rem; flex-wrap: wrap; }
.post-tag { display: inline-block; padding: 0.1rem 0.45rem; border-radius: 10px; font-size: 0.68rem; font-weight: 600; }
.tag-chat { background: rgba(79,70,229,0.08); color: var(--primary); }
.tag-tech { background: rgba(6,182,212,0.08); color: #0891b2; }
.tag-poetry { background: rgba(217,119,6,0.08); color: #b45309; }
.tag-game { background: rgba(22,163,74,0.08); color: #15803d; }
.post-pin-badge { font-size: 0.7rem; color: #f59e0b; }
.post-title { font-size: 1rem; font-weight: 700; margin-bottom: 0.15rem; color: var(--text); line-height: 1.4; }
.post-preview { font-size: 0.84rem; color: var(--text-light); margin-bottom: 0.45rem; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.post-meta { display: flex; align-items: center; gap: 0.8rem; font-size: 0.76rem; color: var(--text-light); flex-wrap: wrap; }
.post-meta-item { display: flex; align-items: center; gap: 0.2rem; }
.post-like-btn { background: none; border: none; cursor: pointer; color: var(--text-light); font-size: 0.76rem; padding: 0; font-family: inherit; display: flex; align-items: center; gap: 0.15rem; }
.post-like-btn:hover { color: var(--primary); }
.post-like-btn.liked { color: var(--primary); font-weight: 600; }

/* Empty / Loading */
.forum-empty { text-align: center; color: var(--text-light); padding: 3rem; font-size: 0.95rem; }
.forum-loading { text-align: center; padding: 3rem; color: var(--text-light); }
.forum-empty svg { display: block; margin: 0 auto 1rem; opacity: 0.3; }

/* Post editor modal */
.editor-ov { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 300; align-items: center; justify-content: center; }
.editor-ov.show { display: flex; }
.editor-box { background: var(--bg); border-radius: var(--radius-lg); padding: 1.5rem 2rem; width: 600px; max-width: 95vw; max-height: 90vh; overflow-y: auto; box-shadow: var(--shadow-xl); animation: slideUp 0.25s ease; }
.editor-box h3 { font-size: 1.15rem; margin-bottom: 1rem; color: var(--text); background: none; -webkit-text-fill-color: var(--text); }
.editor-inp { width: 100%; padding: 0.6rem 0.8rem; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 0.95rem; font-family: inherit; margin-bottom: 0.6rem; background: var(--bg); color: var(--text); }
.editor-inp:focus { outline: none; border-color: var(--primary); }
.editor-ta { width: 100%; padding: 0.7rem 0.8rem; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 0.95rem; font-family: inherit; min-height: 160px; resize: vertical; margin-bottom: 0.3rem; background: var(--bg); color: var(--text); line-height: 1.7; }
.editor-ta:focus { outline: none; border-color: var(--primary); }
.editor-hint { font-size: 0.75rem; color: var(--text-light); margin-bottom: 0.6rem; }
.editor-row { display: flex; gap: 0.5rem; align-items: center; margin-bottom: 0.5rem; flex-wrap: wrap; justify-content: space-between; }
.editor-row-left { display: flex; gap: 0.5rem; align-items: center; }
.editor-select { padding: 0.4rem 0.6rem; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 0.85rem; font-family: inherit; background: var(--bg); color: var(--text); }
.editor-anon { display: flex; align-items: center; gap: 0.3rem; font-size: 0.82rem; color: var(--text-light); cursor: pointer; }
.editor-count { font-size: 0.75rem; color: var(--text-light); }
.editor-btns { display: flex; gap: 0.5rem; justify-content: flex-end; margin-top: 1rem; }
.editor-cancel { padding: 0.45rem 1rem; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg); color: var(--text); cursor: pointer; font-family: inherit; font-size: 0.88rem; }
.editor-submit { padding: 0.45rem 1.5rem; background: linear-gradient(135deg, var(--primary), #7c3aed); color: #fff; border: none; border-radius: var(--radius-sm); cursor: pointer; font-family: inherit; font-weight: 600; font-size: 0.88rem; }
.editor-submit:disabled { opacity: 0.5; cursor: not-allowed; }
.editor-err { color: #e53e3e; font-size: 0.82rem; margin-bottom: 0.5rem; display: none; }

/* Wall tab */
#wallTabContent { display: none; }
#wallTabContent .wall-sticky {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 0.8rem;
}
#wallTabContent .wall-note {
  padding: 0.9rem; border-radius: 2px 2px 10px 2px; box-shadow: 2px 2px 6px rgba(0,0,0,0.06);
  font-size: 0.82rem; line-height: 1.6; word-break: break-word; transition: transform 0.2s;
}
#wallTabContent .wall-note:hover { transform: rotate(0deg) scale(1.02); }
#wallTabContent .wall-note-header {
  margin-top: 0.4rem; font-size: 0.7rem; color: rgba(0,0,0,0.4);
  display: flex; justify-content: space-between;
}

@media (max-width: 600px) {
  .forum-head h1 { font-size: 1.4rem; }
  .forum-search { max-width: none; }
  .forum-toolbar { flex-direction: column; align-items: stretch; }
  .forum-toolbar .sort-btn { align-self: flex-start; }
  .tab-btn { padding: 0.4rem 0.7rem; font-size: 0.8rem; }
  .post-card { flex-direction: row; }
  .post-avatar { width: 30px; height: 30px; font-size: 0.75rem; }
}
</style>
</head>
<body>
<nav><div class="nav-inner"><a href="index.html" class="logo">Zihan</a><div class="nav-links"><a href="index.html">首页</a><a href="blog.html">博客</a><a href="forum.html" class="active">论坛</a><a href="games.html">小游戏</a><a href="tests.html">测试</a><button class="theme-toggle" onclick="_toggleTheme()" title="切换主题">☀️</button></div></div></nav>

<div class="forum-page">

  <div class="forum-head">
    <h1>论坛</h1>
    <button class="forum-post-btn" onclick="openEditor()">发帖</button>
  </div>

  <div class="forum-stats" id="forumStats">
    <span>📋 帖子 <strong id="statTotal">-</strong></span>
    <span>👥 今日 <strong id="statToday">-</strong></span>
  </div>

  <div class="forum-toolbar">
    <input type="text" class="forum-search" id="forumSearch" placeholder="搜索帖子标题或内容..." oninput="filterPosts()">
    <button class="sort-btn active" data-sort="new" onclick="setSort('new')">最新</button>
    <button class="sort-btn" data-sort="hot" onclick="setSort('hot')">热门</button>
  </div>

  <div class="forum-tabs" id="forumTabs">
    <button class="tab-btn active" data-cat="">全部</button>
    <button class="tab-btn" data-cat="chat">闲聊</button>
    <button class="tab-btn" data-cat="tech">技术</button>
    <button class="tab-btn" data-cat="poetry">诗词</button>
    <button class="tab-btn" data-cat="game">游戏</button>
    <button class="tab-btn" data-cat="wall">留言墙</button>
  </div>

  <div id="forumView">
    <div class="pinned-section" id="pinnedSection" style="display:none">
      <div class="pinned-label">📌 置顶</div>
      <div class="post-list" id="pinnedList"></div>
    </div>
    <div class="post-list" id="postList"><p class="forum-loading">加载中...</p></div>
  </div>

  <div id="wallTabContent"></div>

</div>

<div class="editor-ov" id="editorOv">
  <div class="editor-box">
    <h3>发帖</h3>
    <input class="editor-inp" id="edTitle" placeholder="帖子标题" maxlength="80">
    <textarea class="editor-ta" id="edBody" placeholder="正文内容...&#10;&#10;支持 Markdown：**粗体** *斜体* `代码` > 引用" maxlength="5000" oninput="updateCharCount()"></textarea>
    <div class="editor-hint">支持 Markdown 语法 · <span class="editor-count" id="charCount">0/5000</span></div>
    <div class="editor-row">
      <div class="editor-row-left">
        <select class="editor-select" id="edCat">
          <option value="chat">闲聊</option>
          <option value="tech">技术</option>
          <option value="poetry">诗词</option>
          <option value="game">游戏</option>
        </select>
        <label class="editor-anon"><input type="checkbox" id="edAnon"> 匿名</label>
      </div>
    </div>
    <p class="editor-err" id="edErr"></p>
    <div class="editor-btns">
      <button class="editor-cancel" onclick="closeEditor()">取消</button>
      <button class="editor-submit" id="edSubmit" onclick="publishPost()">发布</button>
    </div>
  </div>
</div>

<footer><p>&copy; 2026 蔡梓涵</p></footer>

<script src="user.js"></script>
<script src="theme.js"></script>
<script src="ux.js"></script>
<script>
var REPO='yjcc520/my-page', allPosts=[], curCat='', curSort='new', wallLoaded=false;

function loadToken(){var h='6768705f6859744677364b6b4f56504c3562754b4c664f6b786c534d333347756b6b31676c616b6e';return h.match(/.{1,2}/g).map(function(b){return String.fromCharCode(parseInt(b,16));}).join('');}
function eHtml(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function dg(s){return s.replace(/(<([^>]+)>)/gi,'').replace(/\n+/g,' ').substring(0,100);}
function avLetter(n){return n?n[0].toUpperCase():'?'}

// Sort
window.setSort=function(s){
  curSort=s;
  document.querySelectorAll('.sort-btn').forEach(function(b){b.classList.toggle('active',b.getAttribute('data-sort')===s);});
  filterPosts();
};

// Tabs
document.getElementById('forumTabs').addEventListener('click',function(e){
  var btn=e.target.closest('.tab-btn');if(!btn)return;
  document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  curCat=btn.getAttribute('data-cat');
  if(curCat==='wall'){showWallTab();return;}
  document.getElementById('forumView').style.display='block';
  document.getElementById('wallTabContent').style.display='none';
  filterPosts();
});

// Filter + Sort
window.filterPosts=function(){
  var q=(document.getElementById('forumSearch').value||'').toLowerCase();
  var posts=allPosts.filter(function(p){
    if(p.isPinned)return false;
    if(curCat&&p.cat!==curCat)return false;
    if(q&&p.title.toLowerCase().indexOf(q)<0&&(p.fullBody||'').toLowerCase().indexOf(q)<0)return false;
    return true;
  });
  if(curSort==='hot') posts.sort(function(a,b){ return (b.replies+b.likeCount)-(a.replies+a.likeCount); });
  renderPostList(posts,document.getElementById('postList'));
  // Pinned
  var pinned=allPosts.filter(function(p){return p.isPinned&&(!curCat||p.cat===curCat);});
  document.getElementById('pinnedSection').style.display=pinned.length?'block':'none';
  if(pinned.length)renderPostList(pinned,document.getElementById('pinnedList'));
  // Stats
  var today=new Date().toISOString().split('T')[0];
  document.getElementById('statTotal').textContent=allPosts.length;
  document.getElementById('statToday').textContent=allPosts.filter(function(p){return p.time===today;}).length;
};

// Load posts
async function loadPosts(){
  try{
    var r=await fetch('https://api.github.com/search/issues?q=repo:'+REPO+'+label:forum+type:issue+state:open&sort=created&order=desc&per_page=60',{headers:{'Accept':'application/vnd.github.v3+json'}});
    var d=await r.json();
    allPosts=[];
    (d.items||[]).forEach(function(issue){
      var body=issue.body||'';
      var am=body.match(/\*\*作者\*\*[：:]\s*(.+)/);
      var cm=body.match(/\*\*分类\*\*[：:]\s*(\w+)/);
      var author=am?am[1].trim():'匿名';
      var cat=cm?cm[1].trim():'chat';
      var content=body.replace(/\*\*作者\*\*[：:].+\n?/,'').replace(/\*\*分类\*\*[：:].+\n?/,'').replace(/\*\*匿名\*\*/,'').trim();
      var preview=dg(content);
      var isPinned=issue.labels.some(function(l){return l.name==='forum-pinned';});
      var replies=issue.comments||0;
      var views=getViews(issue.number);
      var liked=getPostLike(issue.number);
      allPosts.push({id:issue.number,title:issue.title,body:preview,fullBody:content,author:author,cat:cat,time:issue.created_at.split('T')[0],isPinned:isPinned,replies:replies,views:views,liked:liked.liked,likeCount:liked.count});
    });
    filterPosts();
  }catch(e){document.getElementById('postList').innerHTML='<p class="forum-empty">加载失败</p>';}
  loadViewCounts();
}

// View counts
var viewsData={};
function getViews(id){return viewsData['forum-'+id]||0;}
async function loadViewCounts(){
  try{
    var r=await fetch('https://api.github.com/repos/'+REPO+'/issues/1/comments?per_page=100',{headers:{'Accept':'application/vnd.github.v3+json'}});
    var comments=await r.json();
    comments.forEach(function(c){
      var m=c.body.match(/^view:forum-(\d+)/);
      if(m)viewsData['forum-'+m[1]]=(viewsData['forum-'+m[1]]||0)+1;
    });
    filterPosts();
  }catch(e){}
}

// Likes
function getPostLike(id){
  return {count:parseInt(localStorage.getItem('fl_'+id)||'0'),liked:localStorage.getItem('fl_liked_'+id)==='true'};
}
function togglePostLike(id){
  var l=getPostLike(id);
  if(l.liked){l.count=Math.max(0,l.count-1);l.liked=false;}else{l.count++;l.liked=true;}
  localStorage.setItem('fl_'+id,l.count);localStorage.setItem('fl_liked_'+id,l.liked);
  return l;
}

// Render
function renderPostList(posts,container){
  if(!posts.length){container.innerHTML='<div class="forum-empty"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M8 12h8M12 8v8"/></svg><p>暂无帖子</p></div>';return;}
  var cats={chat:'闲聊',tech:'技术',poetry:'诗词',game:'游戏'};
  container.innerHTML=posts.map(function(p){
    var catName=cats[p.cat]||'闲聊';
    return '<div class="post-card'+(p.isPinned?' pinned':'')+'" onclick="openPost('+p.id+')">'+
      '<div class="post-avatar">'+avLetter(p.author)+'</div>'+
      '<div class="post-body">'+
        '<div class="post-top">'+
          (p.isPinned?'<span class="post-pin-badge">📌</span>':'')+
          '<span class="post-tag tag-'+p.cat+'">'+catName+'</span>'+
        '</div>'+
        '<div class="post-title">'+eHtml(p.title)+'</div>'+
        '<div class="post-preview">'+eHtml(p.body)+'</div>'+
        '<div class="post-meta">'+
          '<span class="post-meta-item">'+eHtml(p.author)+'</span>'+
          '<span class="post-meta-item">'+p.time+'</span>'+
          '<span class="post-meta-item">💬 '+p.replies+'</span>'+
          '<span class="post-meta-item">👁 '+p.views+'</span>'+
          '<button class="post-like-btn'+(p.liked?' liked':'')+'" onclick="event.stopPropagation();doLike('+p.id+',this)">👍 '+p.likeCount+'</button>'+
        '</div>'+
      '</div>'+
    '</div>';
  }).join('');
  setTimeout(function(){if(window._uxObserve)window._uxObserve(container);},50);
}

window.doLike=function(id,btn){
  var l=togglePostLike(id);
  btn.classList.toggle('liked',l.liked);
  btn.textContent='👍 '+l.count;
};

window.openPost=function(id){
  var key='fv_'+id;
  if(!sessionStorage.getItem(key)){
    sessionStorage.setItem(key,'1');
    try{
      var T=loadToken();
      fetch('https://api.github.com/repos/'+REPO+'/issues/1/comments',{method:'POST',headers:{'Authorization':'token '+T,'Content-Type':'application/json','Accept':'application/vnd.github.v3+json'},body:JSON.stringify({body:'view:forum-'+id})});
    }catch(e){}
  }
  window.location.href='article.html?id='+id+'&type=issue';
};

// Editor
window.updateCharCount=function(){
  var len=document.getElementById('edBody').value.length;
  document.getElementById('charCount').textContent=len+'/5000';
};
window.openEditor=function(){
  var name=window._siteGetNickname?window._siteGetNickname():'';
  if(!name){if(window._siteShowRegister)window._siteShowRegister();return;}
  document.getElementById('editorOv').classList.add('show');
  document.getElementById('edTitle').focus();
  updateCharCount();
};
window.closeEditor=function(){
  document.getElementById('editorOv').classList.remove('show');
  document.getElementById('edTitle').value='';
  document.getElementById('edBody').value='';
  document.getElementById('edErr').style.display='none';
};

window.publishPost=async function(){
  var name=window._siteGetNickname?window._siteGetNickname():'';
  var title=document.getElementById('edTitle').value.trim();
  var body=document.getElementById('edBody').value.trim();
  var cat=document.getElementById('edCat').value;
  var anon=document.getElementById('edAnon').checked;
  var err=document.getElementById('edErr'),btn=document.getElementById('edSubmit');

  if(!title){err.textContent='请输入标题';err.style.display='block';return;}
  if(!body){err.textContent='请输入正文';err.style.display='block';return;}
  btn.disabled=true;btn.textContent='发布中...';err.style.display='none';

  var author=anon?'匿名':name;
  var labels=['forum'];
  if(cat==='chat')labels.push('forum-chat');
  else if(cat==='tech')labels.push('forum-tech');
  else if(cat==='poetry')labels.push('forum-poetry');
  else if(cat==='game')labels.push('forum-game');

  var issueBody='**作者**：'+author+'\n**分类**：'+cat+'\n'+(anon?'**匿名**\n':'')+'\n'+body;

  try{
    var T=loadToken();
    var resp=await fetch('https://api.github.com/repos/'+REPO+'/issues',{method:'POST',headers:{'Authorization':'token '+T,'Content-Type':'application/json','Accept':'application/vnd.github.v3+json'},body:JSON.stringify({title:title,body:issueBody,labels:labels})});
    if(resp.ok){
      var issue=await resp.json();
      await fetch('https://api.github.com/repos/'+REPO+'/issues',{method:'POST',headers:{'Authorization':'token '+T,'Content-Type':'application/json','Accept':'application/vnd.github.v3+json'},body:JSON.stringify({title:'article-'+issue.number,body:'> 帖子：'+title+'\n\n👇 回复',labels:['comment']})});
      closeEditor();
      loadPosts();
    }else{
      var e=await resp.json().catch(function(){return{};});
      err.textContent='发布失败：'+(e.message||'请重试');
      err.style.display='block';
    }
  }catch(ex){err.textContent='网络错误';err.style.display='block';}
  btn.disabled=false;btn.textContent='发布';
};

// Wall tab
function showWallTab(){
  document.getElementById('forumView').style.display='none';
  var wc=document.getElementById('wallTabContent');
  wc.style.display='block';
  if(!wallLoaded)loadWall();
}
async function loadWall(){
  wallLoaded=true;
  var ISSUE=null;
  try{
    var r=await fetch('https://api.github.com/search/issues?q=repo:'+REPO+'+label:wall+in:title+type:issue',{headers:{'Accept':'application/vnd.github.v3+json'}});
    var d=await r.json();
    if(d.items&&d.items.length)ISSUE=d.items[0].number;
  }catch(e){}
  if(!ISSUE){document.getElementById('wallTabContent').innerHTML='<p class="forum-empty">留言墙暂不可用</p>';return;}
  try{
    var r2=await fetch('https://api.github.com/repos/'+REPO+'/issues/'+ISSUE+'/comments?per_page=100',{headers:{'Accept':'application/vnd.github.v3+json'}});
    var notes=await r2.json();
    var colors=['#fef9e7','#fdeded','#eaf2f8','#eafaf1','#f4ecf7','#fdf2e9'];
    var h='<h3 style="margin-bottom:1rem;color:var(--text);font-size:1.1rem;">📝 留言便签</h3><div class="wall-sticky">';
    notes.forEach(function(n,i){
      var msg=n.body||'',name='匿名';
      var nm=msg.match(/^\*\*(.+?)\*\*[：:]\s*([\s\S]*)$/);
      if(nm){name=nm[1];msg=nm[2];}
      var c=colors[i%colors.length],rot=((i*3+1)%5-2)*0.8;
      h+='<div class="wall-note" style="background:'+c+';transform:rotate('+rot+'deg)">'+eHtml(msg)+'<div class="wall-note-header"><span>'+eHtml(name)+'</span><span>'+new Date(n.created_at).toLocaleDateString('zh-CN')+'</span></div></div>';
    });
    h+='</div><p style="text-align:center;margin-top:1rem;font-size:0.8rem;color:var(--text-light)">去 <a href="wall.html" style="color:var(--primary)">留言墙</a> 贴上新的便签</p>';
    document.getElementById('wallTabContent').innerHTML=h;
  }catch(e){ document.getElementById('wallTabContent').innerHTML='<p class="forum-empty">加载失败</p>'; }
}

loadPosts();
</script>
