<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>写文章 | 蔡梓涵</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="apple-touch-icon" href="/favicon.svg">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="editor.css">
</head>
<body>
    <nav>
        <div class="nav-inner">
            <a href="index.html" class="logo">Zihan</a>
            <div class="nav-links">
                <a href="index.html">首页</a>
                <a href="blog.html">博客</a>
                <a href="write.html" class="active">写文章</a>
                <button class="theme-toggle" onclick="_toggleTheme()" title="切换主题">☀️</button>
            </div>
        </div>
    </nav>

    <div class="write-page" id="writePage">
        <div class="write-container" id="writeContainer">
            <!-- 标题区 -->
            <div class="write-header">
                <textarea id="edTitle" class="write-title" placeholder="输入文章标题..." rows="1" maxlength="100"></textarea>
                <div class="write-meta">
                    <input type="text" id="edTags" class="write-tags" placeholder="添加标签，逗号分隔（如：技术, 生活, 教程）" maxlength="100">
                    <span class="write-author" id="writeAuthor"></span>
                </div>
            </div>

            <!-- Markdown 工具栏 -->
            <div class="write-toolbar">
                <div class="toolbar-group">
                    <button class="tb-btn" onclick="insertMD('**', '**')" title="粗体">B</button>
                    <button class="tb-btn tb-italic" onclick="insertMD('*', '*')" title="斜体">I</button>
                    <button class="tb-btn" onclick="insertMD('`', '`')" title="代码">&lt;/&gt;</button>
                    <span class="tb-divider"></span>
                    <button class="tb-btn" onclick="insertMD('\n## ', '')" title="二级标题">H2</button>
                    <button class="tb-btn" onclick="insertMD('\n### ', '')" title="三级标题">H3</button>
                    <span class="tb-divider"></span>
                    <button class="tb-btn" onclick="insertMD('\n> ', '')" title="引用">❝</button>
                    <button class="tb-btn" onclick="insertMD('\n- ', '')" title="列表">≡</button>
                    <button class="tb-btn" onclick="insertMD('[', '](url)')" title="链接">🔗</button>
                </div>
                <div class="toolbar-actions">
                    <span class="word-count" id="wordCount">0 字</span>
                    <button class="tool-btn" onclick="togglePreview()" id="previewBtn">👁 预览</button>
                    <button class="tb-btn-publish" onclick="publish()" id="publishBtn">发布</button>
                </div>
            </div>

            <!-- 编辑区 -->
            <div class="write-editor-wrap">
                <textarea id="edContent" class="write-content" placeholder="开始写作..."></textarea>
                <div id="mdPreview" class="write-preview" style="display:none"></div>
            </div>

            <div class="write-footer">
                <p id="edError" class="comment-error" style="display:none"></p>
                <p id="edStatus" class="write-status"></p>
            </div>
        </div>
    </div>

    <script src="user.js"></script>
    <script src="gh-publish.js"></script>
    <script>

        var name = (window._siteGetNickname && window._siteGetNickname()) || '蔡梓涵';
        document.getElementById('writeAuthor').textContent = '作者：' + name;

        var previewMode = false;
        window.togglePreview = function() {
            var ta = document.getElementById('edContent');
            var prev = document.getElementById('mdPreview');
            var btn = document.getElementById('previewBtn');
            previewMode = !previewMode;
            ta.style.display = previewMode ? 'none' : 'block';
            prev.style.display = previewMode ? 'block' : 'none';
            btn.innerHTML = previewMode ? '✏️ 编辑' : '👁 预览';
            if (previewMode) prev.innerHTML = formatMarkdown(ta.value || '*暂无内容*');
        };

        // 插入 Markdown 语法
        window.insertMD = function(before, after) {
            var ta = document.getElementById('edContent');
            var s = ta.selectionStart, e = ta.selectionEnd;
            var text = ta.value;
            var selected = text.substring(s, e);
            ta.value = text.substring(0, s) + before + selected + after + text.substring(e);
            ta.focus();
            var newPos = s + before.length + selected.length + after.length;
            if (!selected) newPos = s + before.length;
            ta.setSelectionRange(newPos, newPos);
            updateWordCount();
        };

        // 字数统计
        function updateWordCount() {
            var text = document.getElementById('edContent').value;
            var count = text.replace(/\s/g, '').length;
            document.getElementById('wordCount').textContent = count + ' 字';
        }
        document.getElementById('edContent').addEventListener('input', updateWordCount);

        // 自动标题高度
        var titleEl = document.getElementById('edTitle');
        titleEl.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = this.scrollHeight + 'px';
        });

        // 草稿自动保存
        var saveTimer;
        function saveDraft() {
            clearTimeout(saveTimer);
            saveTimer = setTimeout(function() {
                localStorage.setItem('draft_title', titleEl.value);
                localStorage.setItem('draft_tags', document.getElementById('edTags').value);
                localStorage.setItem('draft_content', document.getElementById('edContent').value);
            }, 800);
        }
        titleEl.addEventListener('input', saveDraft);
        document.getElementById('edTags').addEventListener('input', saveDraft);
        document.getElementById('edContent').addEventListener('input', saveDraft);

        // 恢复草稿
        var dt = localStorage.getItem('draft_title');
        var dg = localStorage.getItem('draft_tags');
        var dc = localStorage.getItem('draft_content');
        if (dt) { titleEl.value = dt; titleEl.dispatchEvent(new Event('input')); }
        if (dg) document.getElementById('edTags').value = dg;
        if (dc) { document.getElementById('edContent').value = dc; updateWordCount(); }

        // 发布：不在前端保存任何凭据，改为跳转 GitHub 官方新建 Issue 页面
        window.publish = function() {
            var title = titleEl.value.trim();
            var tagsStr = document.getElementById('edTags').value.trim();
            var body = document.getElementById('edContent').value.trim();
            var err = document.getElementById('edError');
            var status = document.getElementById('edStatus');

            if (!title) { err.textContent = '请输入标题'; err.style.display = 'block'; return; }
            if (!body) { err.textContent = '请输入正文'; err.style.display = 'block'; return; }
            err.style.display = 'none';

            var tags = tagsStr ? tagsStr.split(/[,，]/).map(function(t) { return t.trim(); }).filter(Boolean) : [];
            var issueBody = '**作者**：' + name + '\n**标签**：' + (tags.join(',') || '未分类') + '\n\n' + body;

            var r = window._ghNewIssue({ title: title, body: issueBody, labels: ['article'] });

            status.innerHTML = (r.copied
                ? '📋 正文较长，已复制到剪贴板 —— 在刚打开的 GitHub 页面里粘贴进正文框，点 <b>Submit new issue</b> 即可。'
                : '📝 已在新标签页打开 GitHub 发布页，确认内容后点 <b>Submit new issue</b> 即可。')
                + ' <a href="javascript:void(0)" onclick="clearDraft()" style="color:var(--primary)">发布完成后清空草稿</a>';
        };

        window.clearDraft = function() {
            localStorage.removeItem('draft_title');
            localStorage.removeItem('draft_tags');
            localStorage.removeItem('draft_content');
            titleEl.value = '';
            document.getElementById('edTags').value = '';
            document.getElementById('edContent').value = '';
            updateWordCount();
            document.getElementById('edStatus').textContent = '草稿已清空';
        };

        function formatMarkdown(md) {
            return ('<p>' + (md || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/### (.+)/g, '<h4>$1</h4>').replace(/## (.+)/g, '<h3>$1</h3>').replace(/# (.+)/g, '<h2>$1</h2>')
                .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/\*(.+?)\*/g, '<em>$1</em>')
                .replace(/`([^`]+)`/g, '<code>$1</code>').replace(/^> (.+)/gm, '<blockquote>$1</blockquote>')
                .replace(/^- (.+)/gm, '<li>$1</li>').replace(/\n\n/g, '</p><p>').replace(/\n/g, '<br>') + '</p>');
        }
    </script>
    <script src="theme.js"></script>
    <script src="music.js"></script>
    <script src="ux.js"></script>
</body>
</html>
